<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Conversation loop</title>
  <desc id="desc">A circular runtime diagram. Six stations arranged on an orbit are traversed once per turn: build context, bid, dispatch, reflect, analyze, persist. A faint outer ring marks the parallel observer loop where each silent advisor decides whether to whisper.</desc>
  <defs>
    <radialGradient id="page" cx="50%" cy="48%" r="75%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#080a10"/>
      <stop offset="100%" stop-color="#04050a"/>
    </radialGradient>
    <pattern id="dotgrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#1c2434" fill-opacity="0.55"/>
    </pattern>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c542" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f5c542" stop-opacity="0"/>
    </radialGradient>
    <marker id="motionTip" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3a4866"/>
    </marker>
    <style>
      .display { font-family: 'Cormorant Garamond', 'Hoefler Text', Garamond, 'Times New Roman', serif; }
      .body    { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; }
      .mono    { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
      .ink     { fill: #ecf0f6; }
      .body-c  { fill: #b9c2d6; }
      .muted   { fill: #5d667a; }
      .gold    { fill: #f5c542; }
      .stroke-hair { stroke: #20283c; stroke-width: 1; fill: none; }
      .stroke-hair-strong { stroke: #344166; stroke-width: 1.2; fill: none; }
      .stroke-rule { stroke: #1a2233; stroke-width: 1; fill: none; }
      .orbit { fill: none; stroke: #2a3550; stroke-width: 1; }
      .orbit-faint { fill: none; stroke: #1c2440; stroke-width: 1; stroke-dasharray: 1 6; }
      .orbit-arc { fill: none; stroke: #364568; stroke-width: 1.4; }
      .station-bullet { fill: #0d1320; stroke: #4a5878; stroke-width: 1.4; }
      .station-bullet-active { fill: #1a1605; stroke: #f5c542; stroke-width: 1.6; }
    </style>
  </defs>

  <rect width="1280" height="660" fill="url(#page)"/>
  <rect width="1280" height="660" fill="url(#dotgrid)"/>

  <!-- masthead -->
  <line x1="64" y1="60" x2="1216" y2="60" class="stroke-hair"/>
  <text x="64" y="48" class="mono ink" font-size="10" font-weight="600" letter-spacing="2">FIG. 03 / RUNTIME</text>
  <text x="1216" y="48" class="mono muted" font-size="10" letter-spacing="2" text-anchor="end">one turn, six stations</text>

  <!-- title -->
  <text x="64" y="120" class="display ink" font-style="italic" font-size="46">A Single Turn</text>
  <text x="64" y="148" class="body body-c" font-size="13">Each pass round the orbit produces one council message. The advisors run their own quieter loop in parallel, slipping notes into the inner agent's context before the next turn begins.</text>

  <!-- ============ CIRCULAR LOOP ============ -->
  <!-- center 640, 380; radius 200 -->

  <circle cx="640" cy="380" r="220" fill="url(#centerGlow)"/>

  <!-- outer observer orbit (radius 250) -->
  <circle cx="640" cy="380" r="250" class="orbit-faint"/>
  <text x="640" y="118" class="mono muted" font-size="10" letter-spacing="2" text-anchor="middle">OBSERVER ORBIT · 8 ADVISORS · ASYNC</text>

  <!-- main orbit (radius 200) -->
  <circle cx="640" cy="380" r="200" class="orbit"/>

  <!-- Inner ring + center -->
  <circle cx="640" cy="380" r="58" class="orbit"/>

  <!-- 6 motion arcs between stations (clockwise) - using path arcs -->
  <!-- Station angles: -90°, -30°, 30°, 90°, 150°, 210°  -->
  <!-- Station coords:
       0 (-90°): (640, 180)
       1 (-30°): (813.2, 280)
       2 (30°):  (813.2, 480)
       3 (90°):  (640, 580)
       4 (150°): (466.8, 480)
       5 (210°): (466.8, 280)
  -->
  <g class="orbit-arc">
    <path d="M 661 184 A 200 200 0 0 1 808 268" marker-end="url(#motionTip)"/>
    <path d="M 818 305 A 200 200 0 0 1 818 455" marker-end="url(#motionTip)"/>
    <path d="M 808 492 A 200 200 0 0 1 661 576" marker-end="url(#motionTip)"/>
    <path d="M 619 576 A 200 200 0 0 1 472 492" marker-end="url(#motionTip)"/>
    <path d="M 462 455 A 200 200 0 0 1 462 305" marker-end="url(#motionTip)"/>
    <path d="M 472 268 A 200 200 0 0 1 619 184" marker-end="url(#motionTip)"/>
  </g>

  <!-- station bullets -->
  <circle cx="640"   cy="180" r="9" class="station-bullet-active"/>
  <circle cx="813.2" cy="280" r="9" class="station-bullet"/>
  <circle cx="813.2" cy="480" r="9" class="station-bullet"/>
  <circle cx="640"   cy="580" r="9" class="station-bullet"/>
  <circle cx="466.8" cy="480" r="9" class="station-bullet"/>
  <circle cx="466.8" cy="280" r="9" class="station-bullet"/>

  <!-- Station labels (offset outward from each bullet) -->
  <!-- 0: top -->
  <g transform="translate(640,180)">
    <text x="0" y="-32" class="mono gold" font-size="9.5" letter-spacing="2" text-anchor="middle">I · CONTEXT</text>
    <text x="0" y="-12" class="display ink" font-style="italic" font-size="20" text-anchor="middle">Build the room</text>
  </g>

  <!-- 1: upper-right -->
  <g transform="translate(813.2,280)">
    <text x="22" y="-22" class="mono muted" font-size="9.5" letter-spacing="2">II · BID</text>
    <text x="22" y="-2"  class="display ink" font-style="italic" font-size="20">Score &amp; pick</text>
    <text x="22" y="20"  class="body body-c" font-size="11">scoreAgentsRelevance</text>
    <text x="22" y="34"  class="body muted" font-size="10.5">+ fairness, conflict bonus</text>
  </g>

  <!-- 2: lower-right -->
  <g transform="translate(813.2,480)">
    <text x="22" y="-22" class="mono muted" font-size="9.5" letter-spacing="2">III · DISPATCH</text>
    <text x="22" y="-2"  class="display ink" font-style="italic" font-size="20">Stream</text>
    <text x="22" y="20"  class="body body-c" font-size="11">SDK → Tauri → reqwest</text>
    <text x="22" y="34"  class="body muted" font-size="10.5">SSE, abort, replay buffer</text>
  </g>

  <!-- 3: bottom -->
  <g transform="translate(640,580)">
    <text x="0" y="32" class="mono muted" font-size="9.5" letter-spacing="2" text-anchor="middle">IV · REFLECT</text>
    <text x="0" y="52" class="display ink" font-style="italic" font-size="20" text-anchor="middle">Critique &amp; revise</text>
    <text x="0" y="72" class="body muted" font-size="10.5" text-anchor="middle">off · light · deep</text>
  </g>

  <!-- 4: lower-left -->
  <g transform="translate(466.8,480)">
    <text x="-22" y="-22" class="mono muted" font-size="9.5" letter-spacing="2" text-anchor="end">V · ANALYZE</text>
    <text x="-22" y="-2"  class="display ink" font-style="italic" font-size="20" text-anchor="end">Make sense</text>
    <text x="-22" y="20"  class="body body-c" font-size="11" text-anchor="end">conflict · fact-check</text>
    <text x="-22" y="34"  class="body muted" font-size="10.5" text-anchor="end">argument map · NLI</text>
  </g>

  <!-- 5: upper-left -->
  <g transform="translate(466.8,280)">
    <text x="-22" y="-22" class="mono muted" font-size="9.5" letter-spacing="2" text-anchor="end">VI · PERSIST</text>
    <text x="-22" y="-2"  class="display ink" font-style="italic" font-size="20" text-anchor="end">Settle</text>
    <text x="-22" y="20"  class="body body-c" font-size="11" text-anchor="end">cost ledger · fairness</text>
    <text x="-22" y="34"  class="body muted" font-size="10.5" text-anchor="end">summary · vault write</text>
  </g>

  <!-- center compass -->
  <text x="640" y="368" class="mono muted" font-size="9" letter-spacing="2" text-anchor="middle">TURN n</text>
  <text x="640" y="388" class="display gold" font-style="italic" font-size="22" text-anchor="middle">→</text>
  <text x="640" y="408" class="mono muted" font-size="9" letter-spacing="2" text-anchor="middle">TURN n+1</text>

  <!-- four observer ticks on outer ring (at 45°, 135°, 225°, 315°) -->
  <!-- positions on r=250 -->
  <g>
    <!-- 4 evenly spaced advisor blips -->
    <circle cx="816.8" cy="203.2" r="3" fill="#5d667a"/>
    <circle cx="816.8" cy="556.8" r="3" fill="#5d667a"/>
    <circle cx="463.2" cy="556.8" r="3" fill="#5d667a"/>
    <circle cx="463.2" cy="203.2" r="3" fill="#5d667a"/>
    <circle cx="890" cy="380" r="3" fill="#5d667a"/>
    <circle cx="390" cy="380" r="3" fill="#5d667a"/>
    <circle cx="640" cy="130" r="3" fill="#f5c542"/>
    <circle cx="640" cy="630" r="3" fill="#5d667a"/>
  </g>

  <!-- footer -->
  <line x1="64" y1="618" x2="1216" y2="618" class="stroke-hair"/>
  <text x="64" y="640" class="mono muted" font-size="9.5" letter-spacing="2">PUBLIC LOOP · 6 STATIONS · ~10–40 SECONDS PER TURN</text>
  <text x="1216" y="640" class="mono muted" font-size="9.5" letter-spacing="2" text-anchor="end">SILENT LOOP · 8 ADVISORS · PARALLEL · MAY PASS</text>
</svg>
