<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Conversation loop: one turn of the council</title>
  <desc id="desc">A five-step pipeline that repeats every turn — build context, bid for relevance, stream the winner's turn, optionally reflect, then analyze for conflict, facts, and argument structure. Two parallel lanes run beneath it: the advisors who whisper private notes, and the moderator. A closing strip shows the end-vote, peer evaluation, and final verdict.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .h1   { fill: #F2F5FA; font-size: 27px; font-weight: 700; letter-spacing: -0.3px; }
      .sub  { fill: #97A2B8; font-size: 14px; }
      .tag  { fill: #F5C542; font-size: 11px; font-weight: 600; letter-spacing: 2.6px; }
      .meta { fill: #6B7690; font-size: 11px; letter-spacing: 2px; }
      .stepnum  { fill: #F5C542; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
      .steptitle{ fill: #ECF0F6; font-size: 16px; font-weight: 650; }
      .stepbody { fill: #A6B0C5; font-size: 12.5px; }
      .lanetitle{ fill: #ECF0F6; font-size: 15px; font-weight: 650; }
      .lanebody { fill: #A6B0C5; font-size: 13px; }
      .lanetag  { fill: #6B7690; font-size: 10.5px; letter-spacing: 2px; }
      .footer   { fill: #6B7690; font-size: 11px; letter-spacing: 1.8px; }
      .edgegold { stroke: #F5C542; stroke-width: 1.8; fill: none; }
      .edge     { stroke: #516080; stroke-width: 1.5; fill: none; }
      .edgedash { stroke: #516080; stroke-width: 1.4; fill: none; stroke-dasharray: 5 5; }
    </style>
    <radialGradient id="bgGlow3" cx="50%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#11182A"/>
      <stop offset="100%" stop-color="#0A0E16"/>
    </radialGradient>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#516080"/>
    </marker>
    <marker id="arrGold3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F5C542"/>
    </marker>
  </defs>

  <rect width="1200" height="700" rx="18" fill="url(#bgGlow3)"/>
  <rect x="0.5" y="0.5" width="1199" height="699" rx="18" fill="none" stroke="#222B3F"/>

  <!-- masthead -->
  <text x="64" y="58" class="mono tag">SOCRATIC COUNCIL</text>
  <text x="1136" y="58" class="mono meta" text-anchor="end">FIG. 03 — CONVERSATION LOOP</text>
  <text x="64" y="98" class="sans h1">What happens every single turn</text>
  <text x="64" y="126" class="sans sub">The loop repeats until the turn cap, a passed end-vote, or you stop it. Advisors and the moderator work alongside, not inside, the pipeline.</text>

  <!-- loop-back arrow (5 -> 1) -->
  <path d="M 1007 196 L 1007 170 L 159 170 L 159 196" class="edgedash" marker-end="url(#arr3)"/>
  <text x="583" y="162" class="mono meta" text-anchor="middle">NEXT TURN</text>

  <!-- ============ MAIN PIPELINE ============ -->
  <!-- 1 CONTEXT -->
  <g transform="translate(64,200)">
    <rect width="190" height="128" rx="12" fill="#121826" stroke="#283349"/>
    <text x="18" y="30" class="mono stepnum">01</text>
    <text x="18" y="54" class="sans steptitle">Context</text>
    <text x="18" y="78" class="sans stepbody">Recent window, rolling</text>
    <text x="18" y="95" class="sans stepbody">summary, attachments —</text>
    <text x="18" y="112" class="sans stepbody">plus your advisor's note.</text>
  </g>
  <line x1="254" y1="264" x2="276" y2="264" class="edgegold" marker-end="url(#arrGold3)"/>

  <!-- 2 BID -->
  <g transform="translate(276,200)">
    <rect width="190" height="128" rx="12" fill="#121826" stroke="#283349"/>
    <text x="18" y="30" class="mono stepnum">02</text>
    <text x="18" y="54" class="sans steptitle">Bid</text>
    <text x="18" y="78" class="sans stepbody">One utility call scores all</text>
    <text x="18" y="95" class="sans stepbody">eight 0–100; fairness damps</text>
    <text x="18" y="112" class="sans stepbody">whoever just spoke.</text>
  </g>
  <line x1="466" y1="264" x2="488" y2="264" class="edgegold" marker-end="url(#arrGold3)"/>

  <!-- 3 SPEAK -->
  <g transform="translate(488,200)">
    <rect width="190" height="128" rx="12" fill="#161408" stroke="#F5C542" stroke-width="1.2"/>
    <text x="18" y="30" class="mono stepnum">03</text>
    <text x="18" y="54" class="sans steptitle">Speak</text>
    <text x="18" y="78" class="sans stepbody">The winner streams its turn</text>
    <text x="18" y="95" class="sans stepbody">over SSE — reasoning is</text>
    <text x="18" y="112" class="sans stepbody">captured separately.</text>
  </g>
  <line x1="678" y1="264" x2="700" y2="264" class="edgegold" marker-end="url(#arrGold3)"/>

  <!-- 4 REFLECT -->
  <g transform="translate(700,200)">
    <rect width="190" height="128" rx="12" fill="#121826" stroke="#283349"/>
    <text x="18" y="30" class="mono stepnum">04</text>
    <text x="18" y="54" class="sans steptitle">Reflect</text>
    <text x="18" y="78" class="sans stepbody">Optional draft → critique →</text>
    <text x="18" y="95" class="sans stepbody">revise before the turn is</text>
    <text x="18" y="112" class="sans stepbody">shown (light or deep).</text>
  </g>
  <line x1="890" y1="264" x2="912" y2="264" class="edgegold" marker-end="url(#arrGold3)"/>

  <!-- 5 ANALYZE -->
  <g transform="translate(912,200)">
    <rect width="190" height="128" rx="12" fill="#121826" stroke="#283349"/>
    <text x="18" y="30" class="mono stepnum">05</text>
    <text x="18" y="54" class="sans steptitle">Analyze</text>
    <text x="18" y="78" class="sans stepbody">Conflict scoring (regex →</text>
    <text x="18" y="95" class="sans stepbody">NLI), fact-check badges,</text>
    <text x="18" y="112" class="sans stepbody">argument map, cost ledger.</text>
  </g>

  <!-- ============ PARALLEL LANES ============ -->
  <!-- advisors lane -->
  <g transform="translate(64,376)">
    <rect width="1038" height="86" rx="12" fill="#0E1422" stroke="#283349" stroke-dasharray="6 4"/>
    <text x="20" y="24" class="mono lanetag">PARALLEL · EVERY FEW TURNS</text>
    <text x="20" y="50" class="sans lanetitle">Advisors</text>
    <text x="130" y="50" class="sans lanebody">Each of the eight advisors reads the public record and may slip a private note to its partner.</text>
    <text x="130" y="70" class="sans lanebody">The note lands only in that partner's next context — no other agent ever sees it.</text>
  </g>
  <path d="M 159 376 L 159 328" class="edge" marker-end="url(#arr3)"/>

  <!-- moderator lane -->
  <g transform="translate(64,486)">
    <rect width="1038" height="86" rx="12" fill="#0E1422" stroke="#283349"/>
    <text x="20" y="24" class="mono lanetag">SYSTEM VOICE</text>
    <text x="20" y="50" class="sans lanetitle">Moderator</text>
    <text x="130" y="50" class="sans lanebody">Opens the session, synthesizes periodically, spotlights contradictions when conflict spikes,</text>
    <text x="130" y="70" class="sans lanebody">calls the closing ballot, and writes the final scored verdict.</text>
  </g>

  <!-- ============ CLOSING STRIP ============ -->
  <g transform="translate(64,596)">
    <rect width="1038" height="56" rx="12" fill="#161408" stroke="#F5C542" stroke-width="1.1"/>
    <text x="20" y="24" class="mono stepnum">WHEN THE ROOM CONVERGES</text>
    <text x="20" y="44" class="sans lanebody">Any agent moves <tspan class="mono" fill="#F5C542">@end()</tspan> → majority vote → peer-eval scorecard (rigor · evidence · novelty · civility · on-topic) → scored verdict · optional deep-research report.</text>
  </g>

  <!-- footer -->
  <line x1="64" y1="672" x2="1136" y2="672" stroke="#222B3F"/>
  <text x="64" y="690" class="mono footer">PAUSE / RESUME / STOP AT ANY POINT</text>
  <text x="1136" y="690" class="mono footer" text-anchor="end">BUDGET CAPS CAN WARN, PAUSE, OR STOP THE LOOP</text>
</svg>
