<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Deliberation protocol: one session of the council</title>
  <desc id="desc">A five-step pipeline — frame, position, cross-examine, board and convergence, revise and record — with a loop from the convergence check back to cross-examination while positions still move. Two lanes run beneath it: the tools the seats may call, and the moderator and utility slots. A closing strip shows the document path and the hand-off folder.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .h1   { fill: #F2F5FA; font-size: 27px; font-weight: 700; letter-spacing: -0.3px; }
      .sub  { fill: #97A2B8; font-size: 14px; }
      .tag  { fill: #F5C542; font-size: 11px; font-weight: 600; letter-spacing: 2.6px; }
      .meta { fill: #6B7690; font-size: 11px; letter-spacing: 2px; }
      .stepnum  { fill: #F5C542; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
      .steptitle{ fill: #ECF0F6; font-size: 16px; font-weight: 650; }
      .stepbody { fill: #A6B0C5; font-size: 12.5px; }
      .lanetitle{ fill: #ECF0F6; font-size: 15px; font-weight: 650; }
      .lanebody { fill: #A6B0C5; font-size: 13px; }
      .lanetag  { fill: #6B7690; font-size: 10.5px; letter-spacing: 2px; }
      .footer   { fill: #6B7690; font-size: 11px; letter-spacing: 1.8px; }
      .edgegold { stroke: #F5C542; stroke-width: 1.8; fill: none; }
      .edge     { stroke: #516080; stroke-width: 1.5; fill: none; }
      .edgedash { stroke: #516080; stroke-width: 1.4; fill: none; stroke-dasharray: 5 5; }
    </style>
    <radialGradient id="bgGlow3" cx="50%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#11182A"/>
      <stop offset="100%" stop-color="#0A0E16"/>
    </radialGradient>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#516080"/>
    </marker>
    <marker id="arrGold3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F5C542"/>
    </marker>
  </defs>

  <rect width="1200" height="700" rx="18" fill="url(#bgGlow3)"/>
  <rect x="0.5" y="0.5" width="1199" height="699" rx="18" fill="none" stroke="#222B3F"/>

  <!-- masthead -->
  <text x="64" y="58" class="mono tag">SOCRATIC COUNCIL</text>
  <text x="1136" y="58" class="mono meta" text-anchor="end">FIG. 03 — DELIBERATION PROTOCOL</text>
  <text x="64" y="98" class="sans h1">What happens in a session</text>
  <text x="64" y="126" class="sans sub">The moderator plans, the seats argue in parallel rounds with tools, the board tracks what is settled, and the run ends in a record.</text>

  <!-- loop-back arrow (4 -> 3) -->
  <path d="M 795 196 L 795 170 L 583 170 L 583 196" class="edgedash" marker-end="url(#arr3)"/>
  <text x="689" y="162" class="mono meta" text-anchor="middle">WHILE POSITIONS STILL MOVE</text>

  <!-- ============ MAIN PIPELINE ============ -->
  <!-- 1 FRAME -->
  <g transform="translate(64,200)">
    <rect width="190" height="128" rx="12" fill="#121826" stroke="#283349"/>
    <text x="18" y="30" class="mono stepnum">01</text>
    <text x="18" y="54" class="sans steptitle">Frame</text>
    <text x="18" y="78" class="sans stepbody">The moderator's plan:</text>
    <text x="18" y="95" class="sans stepbody">deliverable, question,</text>
    <text x="18" y="112" class="sans stepbody">options, routing, lenses.</text>
  </g>
  <line x1="254" y1="264" x2="276" y2="264" class="edgegold" marker-end="url(#arrGold3)"/>

  <!-- 2 POSITION -->
  <g transform="translate(276,200)">
    <rect width="190" height="128" rx="12" fill="#121826" stroke="#283349"/>
    <text x="18" y="30" class="mono stepnum">02</text>
    <text x="18" y="54" class="sans steptitle">Position</text>
    <text x="18" y="78" class="sans stepbody">Prep subtasks, then every</text>
    <text x="18" y="95" class="sans stepbody">seat writes its position</text>
    <text x="18" y="112" class="sans stepbody">independently, in parallel.</text>
  </g>
  <line x1="466" y1="264" x2="488" y2="264" class="edgegold" marker-end="url(#arrGold3)"/>

  <!-- 3 CROSS-EXAMINE -->
  <g transform="translate(488,200)">
    <rect width="190" height="128" rx="12" fill="#161408" stroke="#F5C542" stroke-width="1.2"/>
    <text x="18" y="30" class="mono stepnum">03</text>
    <text x="18" y="54" class="sans steptitle">Cross-examine</text>
    <text x="18" y="78" class="sans stepbody">Seats read each other,</text>
    <text x="18" y="95" class="sans stepbody">call tools, and answer</text>
    <text x="18" y="112" class="sans stepbody">the strongest objection.</text>
  </g>
  <line x1="678" y1="264" x2="700" y2="264" class="edgegold" marker-end="url(#arrGold3)"/>

  <!-- 4 BOARD + CONVERGE -->
  <g transform="translate(700,200)">
    <rect width="190" height="128" rx="12" fill="#121826" stroke="#283349"/>
    <text x="18" y="30" class="mono stepnum">04</text>
    <text x="18" y="54" class="sans steptitle">Board · converge</text>
    <text x="18" y="78" class="sans stepbody">The utility model rewrites</text>
    <text x="18" y="95" class="sans stepbody">the board; the moderator</text>
    <text x="18" y="112" class="sans stepbody">judges the movement.</text>
  </g>
  <line x1="890" y1="264" x2="912" y2="264" class="edgegold" marker-end="url(#arrGold3)"/>

  <!-- 5 REVISE + RECORD -->
  <g transform="translate(912,200)">
    <rect width="190" height="128" rx="12" fill="#121826" stroke="#283349"/>
    <text x="18" y="30" class="mono stepnum">05</text>
    <text x="18" y="54" class="sans steptitle">Revise · record</text>
    <text x="18" y="78" class="sans stepbody">Final positions and votes;</text>
    <text x="18" y="95" class="sans stepbody">the moderator writes the</text>
    <text x="18" y="112" class="sans stepbody">record, dissent included.</text>
  </g>

  <!-- ============ PARALLEL LANES ============ -->
  <!-- tools lane -->
  <g transform="translate(64,376)">
    <rect width="1038" height="86" rx="12" fill="#0E1422" stroke="#283349" stroke-dasharray="6 4"/>
    <text x="20" y="24" class="mono lanetag">UNDER THE SESSION POLICY · NONE / SAFE / ALL · AUTO OR ASK</text>
    <text x="20" y="50" class="sans lanetitle">Tools</text>
    <text x="130" y="50" class="sans lanebody">web_search · verify_claim · search and read attachments · workspace files · run_command in a sandbox.</text>
    <text x="130" y="70" class="sans lanebody">Every result is capped, sanitised and fenced as untrusted data; raw search listings never reach the board.</text>
  </g>
  <path d="M 583 376 L 583 328" class="edge" marker-end="url(#arr3)"/>

  <!-- moderator + utility lane -->
  <g transform="translate(64,486)">
    <rect width="1038" height="86" rx="12" fill="#0E1422" stroke="#283349"/>
    <text x="20" y="24" class="mono lanetag">TWO SLOTS · ANY MODEL</text>
    <text x="20" y="50" class="sans lanetitle">Moderator</text>
    <text x="130" y="50" class="sans lanebody">Frames the question, asks you at most one clarifying question, judges convergence, writes the record.</text>
    <text x="20" y="72" class="sans lanetitle">Utility</text>
    <text x="130" y="72" class="sans lanebody">A fast model that rewrites the board and summarises tool output between rounds.</text>
  </g>

  <!-- ============ CLOSING STRIP ============ -->
  <g transform="translate(64,596)">
    <rect width="1038" height="56" rx="12" fill="#161408" stroke="#F5C542" stroke-width="1.1"/>
    <text x="20" y="24" class="mono stepnum">DOCUMENT DELIVERABLES · HAND-OFF</text>
    <text x="20" y="44" class="sans lanebody">A document gets a draft, a critique round with severities and a revision. Every run ends in a hand-off folder: brief, record, document, board, session.</text>
  </g>

  <!-- footer -->
  <line x1="64" y1="672" x2="1136" y2="672" stroke="#222B3F"/>
  <text x="64" y="690" class="mono footer">STOP AT ANY POINT — THE BOARD AND ROUNDS ARE KEPT</text>
  <text x="1136" y="690" class="mono footer" text-anchor="end">ESTIMATE BEFORE THE RUN · SESSION AND DAILY CAPS DURING IT</text>
</svg>
