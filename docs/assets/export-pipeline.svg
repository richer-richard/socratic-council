<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">What leaves the room</title>
  <desc id="desc">The session — the record, the board, the rounds and the cost ledger — flows through a local renderer into the export formats (Markdown, PDF, DOCX, PPTX, the portable scbundle archive) and, after every run, a hand-off folder with the brief, the record, the document, the board and the session file.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .h1   { fill: #F2F5FA; font-size: 27px; font-weight: 700; letter-spacing: -0.3px; }
      .sub  { fill: #97A2B8; font-size: 14px; }
      .tag  { fill: #F5C542; font-size: 11px; font-weight: 600; letter-spacing: 2.6px; }
      .meta { fill: #6B7690; font-size: 11px; letter-spacing: 2px; }
      .boxtitle { fill: #ECF0F6; font-size: 15.5px; font-weight: 650; }
      .boxbody  { fill: #A6B0C5; font-size: 12.5px; }
      .item     { fill: #C7CFDD; font-size: 12.5px; }
      .itemdim  { fill: #6B7690; font-size: 10.5px; letter-spacing: 1.6px; }
      .fmtname  { fill: #ECF0F6; font-size: 14px; font-weight: 650; }
      .fmtnote  { fill: #8B96AD; font-size: 11.5px; }
      .footer   { fill: #6B7690; font-size: 11px; letter-spacing: 1.8px; }
      .edge     { stroke: #516080; stroke-width: 1.5; fill: none; }
      .edgegold { stroke: #F5C542; stroke-width: 1.8; fill: none; }
      .edgedash { stroke: #516080; stroke-width: 1.4; fill: none; stroke-dasharray: 5 5; }
    </style>
    <radialGradient id="bgGlow4" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#11182A"/>
      <stop offset="100%" stop-color="#0A0E16"/>
    </radialGradient>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#516080"/>
    </marker>
    <marker id="arrGold4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F5C542"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="18" fill="url(#bgGlow4)"/>
  <rect x="0.5" y="0.5" width="1199" height="619" rx="18" fill="none" stroke="#222B3F"/>

  <!-- masthead -->
  <text x="64" y="58" class="mono tag">SOCRATIC COUNCIL</text>
  <text x="1136" y="58" class="mono meta" text-anchor="end">FIG. 04 — WHAT LEAVES THE ROOM</text>
  <text x="64" y="98" class="sans h1">Everything composes on your machine</text>
  <text x="64" y="126" class="sans sub">The record, the board, the rounds and the ledger render into the export formats and a hand-off folder locally. No cloud step anywhere.</text>

  <!-- the session -->
  <g transform="translate(64,168)">
    <rect width="320" height="330" rx="12" fill="#121826" stroke="#283349"/>
    <text x="22" y="34" class="sans boxtitle">The session</text>
    <g class="sans item">
      <circle cx="30" cy="76"  r="3" fill="#F5C542"/><text x="44" y="81">Decision record (or the document)</text>
      <circle cx="30" cy="108" r="3" fill="#34D399"/><text x="44" y="113">The board: settled · disputed · evidence</text>
      <circle cx="30" cy="140" r="3" fill="#60A5FA"/><text x="44" y="145">Rounds: every seat's turn and its tool calls</text>
      <circle cx="30" cy="172" r="3" fill="#A78BFA"/><text x="44" y="177">The plan and the convergence judgements</text>
      <circle cx="30" cy="204" r="3" fill="#F87171"/><text x="44" y="209">Cost ledger (per seat, per lane)</text>
      <circle cx="30" cy="236" r="3" fill="#22D3EE"/><text x="44" y="241">Attachments and the workspace files</text>
    </g>
    <text x="22" y="302" class="mono itemdim">ENCRYPTED AT REST · XCHACHA20-POLY1305</text>
  </g>

  <line x1="384" y1="333" x2="430" y2="333" class="edgegold" marker-end="url(#arrGold4)"/>

  <!-- local renderer -->
  <g transform="translate(430,258)">
    <rect width="232" height="150" rx="12" fill="#161408" stroke="#F5C542" stroke-width="1.2"/>
    <text x="24" y="38" class="sans boxtitle">Local renderer</text>
    <text x="24" y="64" class="sans boxbody">Composes documents from</text>
    <text x="24" y="82" class="sans boxbody">the record, the rounds and</text>
    <text x="24" y="100" class="sans boxbody">the ledger — fully offline.</text>
    <text x="24" y="128" class="mono itemdim">jsPDF · docx · pptxgen</text>
  </g>

  <line x1="662" y1="333" x2="708" y2="333" class="edgegold" marker-end="url(#arrGold4)"/>

  <!-- formats -->
  <g transform="translate(708,168)">
    <g transform="translate(0,0)">
      <rect width="428" height="56" rx="10" fill="#121826" stroke="#283349"/>
      <text x="20" y="25" class="sans fmtname">Markdown</text>
      <text x="20" y="43" class="sans fmtnote">the record first, then every turn by round — diff-friendly</text>
    </g>
    <g transform="translate(0,66)">
      <rect width="428" height="56" rx="10" fill="#121826" stroke="#283349"/>
      <text x="20" y="25" class="sans fmtname">PDF · DOCX · PPTX</text>
      <text x="20" y="43" class="sans fmtnote">for printing, editing in Word, or an executive readout</text>
    </g>
    <g transform="translate(0,132)">
      <rect width="428" height="56" rx="10" fill="#121826" stroke="#283349"/>
      <text x="20" y="25" class="sans fmtname">.scbundle</text>
      <text x="20" y="43" class="sans fmtnote">the whole session with attachments, portable and re-importable</text>
    </g>
    <g transform="translate(0,198)">
      <rect width="428" height="132" rx="10" fill="#161408" stroke="#F5C542" stroke-width="1.1"/>
      <text x="20" y="27" class="sans fmtname">Hand-off folder <tspan class="mono itemdim">AFTER EVERY RUN</tspan></text>
      <text x="20" y="50" class="sans fmtnote">handoff.md — the question, the answer, next steps as a checklist,</text>
      <text x="20" y="67" class="sans fmtnote">open questions, dissent, evidence with sources</text>
      <text x="20" y="90" class="sans fmtnote">record.md · document.md · board.md · session.json</text>
      <text x="20" y="116" class="mono itemdim">OWNER-ONLY FILES · FOR A PERSON OR AN AGENT</text>
    </g>
  </g>

  <!-- round trip -->
  <path d="M 1136 328 L 1152 328 L 1152 540 L 224 540 L 224 498" class="edgedash" marker-end="url(#arr4)"/>
  <text x="600" y="560" class="mono itemdim" text-anchor="middle">A BUNDLE RE-IMPORTS INTO ANOTHER INSTALL — THE ROUND TRIP</text>

  <!-- footer -->
  <line x1="64" y1="586" x2="1136" y2="586" stroke="#222B3F"/>
  <text x="64" y="604" class="mono footer">THE TUI EXPORTS THE SAME MARKDOWN · socratic-council handoff &lt;id&gt; REBUILDS THE FOLDER</text>
  <text x="1136" y="604" class="mono footer" text-anchor="end">100% LOCAL</text>
</svg>
