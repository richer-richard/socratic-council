<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Export pipeline</title>
  <desc id="desc">The session — transcript plus computed artifacts — flows through a local renderer into five take-away formats: Markdown, PDF, DOCX, PPTX, and the portable scbundle archive, which can be re-imported by another install.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .h1   { fill: #F2F5FA; font-size: 27px; font-weight: 700; letter-spacing: -0.3px; }
      .sub  { fill: #97A2B8; font-size: 14px; }
      .tag  { fill: #F5C542; font-size: 11px; font-weight: 600; letter-spacing: 2.6px; }
      .meta { fill: #6B7690; font-size: 11px; letter-spacing: 2px; }
      .boxtitle { fill: #ECF0F6; font-size: 16px; font-weight: 650; }
      .boxbody  { fill: #A6B0C5; font-size: 13px; }
      .item     { fill: #C7D0E0; font-size: 13px; }
      .itemdim  { fill: #8B96AD; font-size: 12px; }
      .fmtname  { fill: #ECF0F6; font-size: 15px; font-weight: 650; }
      .fmtnote  { fill: #97A2B8; font-size: 12px; }
      .footer   { fill: #6B7690; font-size: 11px; letter-spacing: 1.8px; }
      .edgegold { stroke: #F5C542; stroke-width: 1.8; fill: none; }
      .edge     { stroke: #516080; stroke-width: 1.5; fill: none; }
      .edgedash { stroke: #516080; stroke-width: 1.4; fill: none; stroke-dasharray: 5 5; }
    </style>
    <radialGradient id="bgGlow4" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#11182A"/>
      <stop offset="100%" stop-color="#0A0E16"/>
    </radialGradient>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#516080"/>
    </marker>
    <marker id="arrGold4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F5C542"/>
    </marker>
    <filter id="goldGlow4" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F5C542" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="620" rx="18" fill="url(#bgGlow4)"/>
  <rect x="0.5" y="0.5" width="1199" height="619" rx="18" fill="none" stroke="#222B3F"/>

  <!-- masthead -->
  <text x="64" y="58" class="mono tag">SOCRATIC COUNCIL</text>
  <text x="1136" y="58" class="mono meta" text-anchor="end">FIG. 04 — EXPORTS</text>
  <text x="64" y="98" class="sans h1">Everything composes on your machine</text>
  <text x="64" y="126" class="sans sub">The transcript and every computed artifact render into five formats locally. No cloud handoff at any step.</text>

  <!-- ============ LEFT: THE SESSION ============ -->
  <g transform="translate(64,176)">
    <rect width="330" height="316" rx="12" fill="#121826" stroke="#283349"/>
    <text x="22" y="34" class="sans boxtitle">The session</text>
    <line x1="22" y1="50" x2="308" y2="50" stroke="#222B3F"/>
    <g class="sans item">
      <circle cx="30" cy="76"  r="3" fill="#F5C542"/><text x="44" y="81">Transcript + advisor notes</text>
      <circle cx="30" cy="108" r="3" fill="#60A5FA"/><text x="44" y="113">Cost ledger (per agent, per turn)</text>
      <circle cx="30" cy="140" r="3" fill="#F87171"/><text x="44" y="145">Pairwise conflict graph</text>
      <circle cx="30" cy="172" r="3" fill="#34D399"/><text x="44" y="177">Argument map (claims → rebuttals)</text>
      <circle cx="30" cy="204" r="3" fill="#22D3EE"/><text x="44" y="209">Fact-check badges</text>
      <circle cx="30" cy="236" r="3" fill="#F472B6"/><text x="44" y="241">Peer-eval scorecard</text>
      <circle cx="30" cy="268" r="3" fill="#A78BFA"/><text x="44" y="273">Deep-research report</text>
    </g>
    <text x="22" y="302" class="mono itemdim">ENCRYPTED AT REST · XCHACHA20-POLY1305</text>
  </g>

  <!-- arrow session -> renderer -->
  <line x1="394" y1="334" x2="468" y2="334" class="edgegold" marker-end="url(#arrGold4)"/>

  <!-- ============ MIDDLE: RENDERER ============ -->
  <g transform="translate(472,264)">
    <rect width="252" height="140" rx="12" fill="#161408" stroke="#F5C542" stroke-width="1.3" filter="url(#goldGlow4)"/>
    <text x="24" y="38" class="sans boxtitle">Local renderer</text>
    <text x="24" y="64" class="sans boxbody">Composes documents from the</text>
    <text x="24" y="82" class="sans boxbody">transcript and artifacts — fully</text>
    <text x="24" y="100" class="sans boxbody">offline, nothing uploaded.</text>
    <text x="24" y="124" class="mono itemdim">jsPDF · docx · pptxgen · fflate</text>
  </g>

  <!-- arrows renderer -> formats -->
  <path d="M 724 300 C 760 300, 768 212, 800 212" class="edge" marker-end="url(#arr4)"/>
  <path d="M 724 320 C 760 320, 768 286, 800 286" class="edge" marker-end="url(#arr4)"/>
  <path d="M 724 340 C 760 340, 768 360, 800 360" class="edge" marker-end="url(#arr4)"/>
  <path d="M 724 360 C 760 360, 768 434, 800 434" class="edge" marker-end="url(#arr4)"/>
  <path d="M 724 380 C 760 380, 768 508, 800 508" class="edgegold" marker-end="url(#arrGold4)"/>

  <!-- ============ RIGHT: FORMATS ============ -->
  <g transform="translate(800,186)">
    <rect width="336" height="52" rx="10" fill="#121826" stroke="#283349"/>
    <text x="20" y="25" class="sans fmtname">Markdown</text>
    <text x="20" y="43" class="sans fmtnote">diff-friendly, drops into docs and issues</text>
  </g>
  <g transform="translate(800,260)">
    <rect width="336" height="52" rx="10" fill="#121826" stroke="#283349"/>
    <text x="20" y="25" class="sans fmtname">PDF</text>
    <text x="20" y="43" class="sans fmtnote">transcript + conflict graph + summaries</text>
  </g>
  <g transform="translate(800,334)">
    <rect width="336" height="52" rx="10" fill="#121826" stroke="#283349"/>
    <text x="20" y="25" class="sans fmtname">DOCX</text>
    <text x="20" y="43" class="sans fmtnote">structured sections, tables, full citations</text>
  </g>
  <g transform="translate(800,408)">
    <rect width="336" height="52" rx="10" fill="#121826" stroke="#283349"/>
    <text x="20" y="25" class="sans fmtname">PPTX</text>
    <text x="20" y="43" class="sans fmtnote">graphics-first readout of key moments</text>
  </g>
  <g transform="translate(800,482)">
    <rect width="336" height="52" rx="10" fill="#161408" stroke="#F5C542" stroke-width="1.2"/>
    <text x="20" y="25" class="sans fmtname">.scbundle</text>
    <text x="20" y="43" class="sans fmtnote">the whole session, portable + re-importable</text>
  </g>

  <!-- round-trip arrow -->
  <path d="M 968 534 L 968 560 L 229 560 L 229 496" class="edgedash" marker-end="url(#arr4)"/>
  <text x="598" y="552" class="mono itemdim" text-anchor="middle">RE-IMPORTS INTO ANOTHER INSTALL — THE ROUND TRIP</text>

  <!-- footer -->
  <line x1="64" y1="584" x2="1136" y2="584" stroke="#222B3F"/>
  <text x="64" y="604" class="mono footer">ARGUMENT MAP ALSO EXPORTS ALONE: JSON · MERMAID · SVG · PNG</text>
  <text x="1136" y="604" class="mono footer" text-anchor="end">100% LOCAL</text>
</svg>
