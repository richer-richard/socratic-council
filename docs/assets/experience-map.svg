<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Experience map: Socratic Council</title>
  <desc id="desc">A diagram of the council. The topic sits at the center of two concentric rings: eight inner debaters and eight paired advisors. Around the rings, four panels label the surfaces the user works with: tools, transcript, sense-making, and exports.</desc>
  <defs>
    <radialGradient id="page" cx="50%" cy="46%" r="70%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#080a10"/>
      <stop offset="100%" stop-color="#04050a"/>
    </radialGradient>
    <pattern id="dotgrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#1c2434" fill-opacity="0.55"/>
    </pattern>
    <radialGradient id="topicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c542" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#f5c542" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#f5c542" stop-opacity="0"/>
    </radialGradient>
    <style>
      .display { font-family: 'Cormorant Garamond', 'Hoefler Text', Garamond, 'Times New Roman', serif; font-style: italic; }
      .body    { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; }
      .mono    { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 0.18em; }
      .display-num { font-family: 'Cormorant Garamond', Garamond, serif; font-style: normal; font-weight: 500; }
      .ink     { fill: #ecf0f6; }
      .body-c  { fill: #b9c2d6; }
      .muted   { fill: #5d667a; }
      .hair    { fill: #283246; }
      .gold    { fill: #f5c542; }
      .stroke-hair { stroke: #25304a; stroke-width: 1; fill: none; }
      .stroke-hair-strong { stroke: #3a4866; stroke-width: 1.2; fill: none; }
      .stroke-gold { stroke: #f5c542; stroke-width: 1.2; fill: none; }
      .ring { fill: none; stroke: #2a3550; stroke-width: 1; }
      .ring-faint { fill: none; stroke: #1a2236; stroke-width: 1; stroke-dasharray: 1 5; }
      .agent-inner { fill: #0d1320; stroke: #4a5878; stroke-width: 1.4; }
      .agent-inner-active { fill: #1a1605; stroke: #f5c542; stroke-width: 1.4; }
      .agent-outer { fill: #06090f; stroke: #2f3a55; stroke-width: 1; }
      .agent-outer-active { fill: #0a0904; stroke: #b08820; stroke-width: 1; stroke-dasharray: 2 2; }
      .pair-link { stroke: #243049; stroke-width: 1; stroke-dasharray: 2 4; fill: none; }
      .pair-link-active { stroke: #6a5418; stroke-width: 1; stroke-dasharray: 2 4; fill: none; }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1280" height="600" fill="url(#page)"/>
  <rect width="1280" height="600" fill="url(#dotgrid)"/>

  <!-- masthead rule + meta -->
  <line x1="64" y1="60" x2="1216" y2="60" class="stroke-hair"/>
  <text x="64" y="48" class="mono ink" font-size="10" font-weight="600">FIG. 01 / EXPERIENCE</text>
  <text x="1216" y="48" class="mono muted" font-size="10" text-anchor="end">socratic-council · v1</text>

  <!-- title block -->
  <text x="64" y="116" class="display ink" font-size="44">An Atlas of the Council</text>
  <text x="64" y="142" class="body body-c" font-size="13">A topic enters the chamber. Sixteen agents take their stations: eight to debate in public, eight to whisper in confidence. The room produces transcript, evidence, and structured sense.</text>

  <!-- ===================================== -->
  <!--   COUNCIL CIRCLE (centered at 640,360) -->
  <!-- ===================================== -->

  <!-- ambient glow -->
  <circle cx="640" cy="360" r="220" fill="url(#topicGlow)"/>

  <!-- concentric ring labels (cartographic) -->
  <circle cx="640" cy="360" r="200" class="ring-faint"/>
  <circle cx="640" cy="360" r="156" class="ring"/>
  <circle cx="640" cy="360" r="100" class="ring"/>
  <circle cx="640" cy="360" r="42"  class="ring"/>

  <!-- compass ticks at 8 positions -->
  <g stroke="#3a4866" stroke-width="1" fill="none">
    <!-- 8 radial ticks -->
    <line x1="640" y1="148" x2="640" y2="160"/>
    <line x1="789.9" y1="210.1" x2="781.4" y2="218.6"/>
    <line x1="852" y1="360" x2="840" y2="360"/>
    <line x1="789.9" y1="509.9" x2="781.4" y2="501.4"/>
    <line x1="640" y1="572" x2="640" y2="560"/>
    <line x1="490.1" y1="509.9" x2="498.6" y2="501.4"/>
    <line x1="428" y1="360" x2="440" y2="360"/>
    <line x1="490.1" y1="210.1" x2="498.6" y2="218.6"/>
  </g>

  <!-- pair links (inner -> outer) -->
  <g>
    <line x1="640" y1="260" x2="640" y2="204" class="pair-link"/>
    <line x1="710.7" y1="289.3" x2="750.4" y2="249.6" class="pair-link"/>
    <line x1="740" y1="360" x2="796" y2="360" class="pair-link"/>
    <line x1="710.7" y1="430.7" x2="750.4" y2="470.4" class="pair-link"/>
    <line x1="640" y1="460" x2="640" y2="516" class="pair-link-active"/>
    <line x1="569.3" y1="430.7" x2="529.6" y2="470.4" class="pair-link"/>
    <line x1="540" y1="360" x2="484" y2="360" class="pair-link"/>
    <line x1="569.3" y1="289.3" x2="529.6" y2="249.6" class="pair-link"/>
  </g>

  <!-- inner ring agents (8 dots, radius 100) -->
  <g>
    <circle cx="640"   cy="260"   r="11" class="agent-inner"/>
    <circle cx="710.7" cy="289.3" r="11" class="agent-inner"/>
    <circle cx="740"   cy="360"   r="11" class="agent-inner"/>
    <circle cx="710.7" cy="430.7" r="11" class="agent-inner"/>
    <circle cx="640"   cy="460"   r="11" class="agent-inner-active"/>
    <circle cx="569.3" cy="430.7" r="11" class="agent-inner"/>
    <circle cx="540"   cy="360"   r="11" class="agent-inner"/>
    <circle cx="569.3" cy="289.3" r="11" class="agent-inner"/>
  </g>

  <!-- outer ring advisors (8 dots, radius 156) -->
  <g>
    <circle cx="640"   cy="204"   r="7" class="agent-outer"/>
    <circle cx="750.4" cy="249.6" r="7" class="agent-outer"/>
    <circle cx="796"   cy="360"   r="7" class="agent-outer"/>
    <circle cx="750.4" cy="470.4" r="7" class="agent-outer"/>
    <circle cx="640"   cy="516"   r="7" class="agent-outer-active"/>
    <circle cx="529.6" cy="470.4" r="7" class="agent-outer"/>
    <circle cx="484"   cy="360"   r="7" class="agent-outer"/>
    <circle cx="529.6" cy="249.6" r="7" class="agent-outer"/>
  </g>

  <!-- agent labels (mono, just first initials in lowercase as cartographic markers) -->
  <g class="mono muted" font-size="9" text-anchor="middle">
    <text x="640" y="244">G</text>
    <text x="722" y="282">C</text>
    <text x="754" y="364">A</text>
    <text x="722" y="446">D</text>
    <text x="640" y="446" class="mono gold">K</text>
    <text x="558" y="446">Q</text>
    <text x="526" y="364">M</text>
    <text x="558" y="282">Z</text>
  </g>

  <!-- topic core -->
  <text x="640" y="354" class="display ink" font-size="20" text-anchor="middle">Topic</text>
  <text x="640" y="372" class="mono muted" font-size="9" text-anchor="middle">PROMPT · FILES</text>

  <!-- ring labels -->
  <text x="640" y="184" class="mono muted" font-size="9" text-anchor="middle">ADVISORS · OUTER</text>
  <text x="640" y="284" class="mono muted" font-size="9" text-anchor="middle">COUNCIL · INNER</text>

  <!-- ===================================== -->
  <!--   FOUR SURFACE PANELS (cardinals)     -->
  <!-- ===================================== -->

  <!-- top-left: TOOLS -->
  <g transform="translate(64,200)">
    <line x1="0" y1="0" x2="240" y2="0" class="stroke-hair-strong"/>
    <text x="0" y="-8" class="mono muted" font-size="10">I · TOOLS</text>
    <text x="0" y="28" class="display ink" font-size="22">Oracle &amp; Search</text>
    <text x="0" y="50" class="body body-c" font-size="11.5">Each agent can call <tspan class="mono" fill="#9ba6bf">@tool(oracle.*)</tspan> to fetch evidence,</text>
    <text x="0" y="68" class="body body-c" font-size="11.5">verify a claim, or quote a source.</text>
    <text x="0" y="98" class="mono muted" font-size="9.5">oracle.search</text>
    <text x="0" y="113" class="mono muted" font-size="9.5">oracle.verify</text>
    <text x="0" y="128" class="mono muted" font-size="9.5">attachments · pdf · text</text>
  </g>

  <!-- top-right: TRANSCRIPT -->
  <g transform="translate(976,200)">
    <line x1="0" y1="0" x2="240" y2="0" class="stroke-hair-strong"/>
    <text x="240" y="-8" class="mono muted" font-size="10" text-anchor="end">II · TRANSCRIPT</text>
    <text x="240" y="28" class="display ink" font-size="22" text-anchor="end">Public Record</text>
    <text x="240" y="50" class="body body-c" font-size="11.5" text-anchor="end">Streaming messages with quotes, reactions,</text>
    <text x="240" y="68" class="body body-c" font-size="11.5" text-anchor="end">tokens, latency, and per-message cost.</text>
    <text x="240" y="98" class="mono muted" font-size="9.5" text-anchor="end">virtuoso scroll</text>
    <text x="240" y="113" class="mono muted" font-size="9.5" text-anchor="end">@quote · @react</text>
    <text x="240" y="128" class="mono muted" font-size="9.5" text-anchor="end">advisor whispers</text>
  </g>

  <!-- bottom-left: SENSE-MAKING -->
  <g transform="translate(64,490)">
    <line x1="0" y1="0" x2="240" y2="0" class="stroke-hair-strong"/>
    <text x="0" y="-8" class="mono muted" font-size="10">III · SENSE-MAKING</text>
    <text x="0" y="28" class="display ink" font-size="22">Living Map</text>
    <text x="0" y="50" class="body body-c" font-size="11.5">An argument graph grows turn-by-turn.</text>
    <text x="0" y="68" class="body body-c" font-size="11.5">Conflict scores, fact-check badges, end vote.</text>
  </g>

  <!-- bottom-right: EXPORTS -->
  <g transform="translate(976,490)">
    <line x1="0" y1="0" x2="240" y2="0" class="stroke-hair-strong"/>
    <text x="240" y="-8" class="mono muted" font-size="10" text-anchor="end">IV · EXPORTS</text>
    <text x="240" y="28" class="display ink" font-size="22" text-anchor="end">Take it Away</text>
    <text x="240" y="50" class="body body-c" font-size="11.5" text-anchor="end">Markdown, PDF, DOCX, PPTX,</text>
    <text x="240" y="68" class="body body-c" font-size="11.5" text-anchor="end">or a portable <tspan class="mono" fill="#f5c542">.scbundle</tspan> archive.</text>
  </g>

  <!-- footer rule + colophon -->
  <line x1="64" y1="556" x2="1216" y2="556" class="stroke-hair"/>
  <text x="64" y="578" class="mono muted" font-size="9.5">8 PROVIDERS · 16 AGENTS · 1 LOCAL VAULT</text>
  <text x="1216" y="578" class="display muted" font-size="13" text-anchor="end" font-style="italic">drawn from the source</text>
</svg>
