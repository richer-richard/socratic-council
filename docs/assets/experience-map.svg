<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Experience map: Socratic Council</title>
  <desc id="desc">Left: the council — your topic at the center of a ring of eight provider-colored seats, with the moderator above and the utility slot below. Right: the four things a session produces — the framing, the rounds, the board, and the decision record with its hand-off folder.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .h1   { fill: #F2F5FA; font-size: 27px; font-weight: 700; letter-spacing: -0.3px; }
      .sub  { fill: #97A2B8; font-size: 14px; }
      .tag  { fill: #F5C542; font-size: 11px; font-weight: 600; letter-spacing: 2.6px; }
      .meta { fill: #6B7690; font-size: 11px; letter-spacing: 2px; }
      .cardtitle { fill: #ECF0F6; font-size: 16.5px; font-weight: 650; }
      .cardbody  { fill: #AEB8CC; font-size: 13px; }
      .chip      { fill: #8B96AD; font-size: 11.5px; }
      .seatname  { fill: #D7DEEA; font-size: 12.5px; font-weight: 600; }
      .ringlabel { fill: #6B7690; font-size: 10.5px; letter-spacing: 1.6px; }
      .slot      { fill: #F5C542; font-size: 10.5px; font-weight: 600; letter-spacing: 1.6px; }
      .footer    { fill: #6B7690; font-size: 11px; letter-spacing: 1.8px; }
    </style>
    <radialGradient id="bgGlow" cx="28%" cy="62%" r="55%">
      <stop offset="0%" stop-color="#131A2A"/>
      <stop offset="100%" stop-color="#0A0E16"/>
    </radialGradient>
    <radialGradient id="topicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5C542" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#F5C542" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#F5C542" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGold" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#F5C542" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="660" rx="18" fill="url(#bgGlow)"/>
  <rect x="0.5" y="0.5" width="1199" height="659" rx="18" fill="none" stroke="#222B3F"/>

  <!-- masthead -->
  <text x="64" y="58" class="mono tag">SOCRATIC COUNCIL</text>
  <text x="1136" y="58" class="mono meta" text-anchor="end">FIG. 01 — EXPERIENCE</text>
  <text x="64" y="98" class="sans h1">One question, a moderated council, a record you can act on</text>
  <text x="64" y="126" class="sans sub">Eight seats from eight providers argue in structured rounds. A moderator plans, judges convergence and writes the record.</text>

  <!-- ================= LEFT: THE COUNCIL (center 340,408) ================= -->
  <circle cx="340" cy="408" r="208" fill="url(#topicGlow)"/>
  <circle cx="340" cy="408" r="128" fill="none" stroke="#2E3A54"/>

  <!-- spokes seat -> topic -->
  <g stroke="#3A4866" stroke-width="1" stroke-dasharray="3 4">
    <line x1="340" y1="280" x2="340" y2="362"/>
    <line x1="430.5" y1="317.5" x2="372.5" y2="375.5"/>
    <line x1="468" y1="408" x2="386" y2="408"/>
    <line x1="430.5" y1="498.5" x2="372.5" y2="440.5"/>
    <line x1="340" y1="536" x2="340" y2="454"/>
    <line x1="249.5" y1="498.5" x2="307.5" y2="440.5"/>
    <line x1="212" y1="408" x2="294" y2="408"/>
    <line x1="249.5" y1="317.5" x2="307.5" y2="375.5"/>
  </g>

  <!-- seats (r=128) -->
  <g stroke="#0A0E16" stroke-width="2">
    <circle cx="340"   cy="280"   r="13" fill="#60A5FA"/>
    <circle cx="430.5" cy="317.5" r="13" fill="#FBBF24"/>
    <circle cx="468"   cy="408"   r="13" fill="#34D399"/>
    <circle cx="430.5" cy="498.5" r="13" fill="#F87171"/>
    <circle cx="340"   cy="536"   r="13" fill="#2DD4BF"/>
    <circle cx="249.5" cy="498.5" r="13" fill="#22D3EE"/>
    <circle cx="212"   cy="408"   r="13" fill="#F472B6"/>
    <circle cx="249.5" cy="317.5" r="13" fill="#A78BFA"/>
  </g>

  <!-- seat labels -->
  <g class="sans seatname">
    <text x="340" y="262" text-anchor="middle">George · OpenAI</text>
    <text x="450" y="308" text-anchor="start">Cathy · Anthropic</text>
    <text x="490" y="412" text-anchor="start">Grace · Google</text>
    <text x="450" y="520" text-anchor="start">Douglas · DeepSeek</text>
    <text x="340" y="566" text-anchor="middle">Kate · Kimi</text>
    <text x="230" y="520" text-anchor="end">Quinn · Qwen</text>
    <text x="190" y="412" text-anchor="end">Mary · MiniMax</text>
    <text x="230" y="308" text-anchor="end">Zara · Z.AI</text>
  </g>

  <!-- topic core -->
  <circle cx="340" cy="408" r="46" fill="#141B2E" stroke="#F5C542" stroke-width="1.4" filter="url(#softGold)"/>
  <text x="340" y="404" class="sans" font-size="15.5" font-weight="650" fill="#F2F5FA" text-anchor="middle">Topic</text>
  <text x="340" y="422" class="mono" font-size="9.5" fill="#8B96AD" text-anchor="middle" letter-spacing="1.2">+ FILES</text>

  <!-- slots above and below the ring -->
  <g>
    <rect x="262" y="196" width="156" height="30" rx="15" fill="#161408" stroke="#F5C542" stroke-width="1"/>
    <text x="340" y="215" class="mono slot" text-anchor="middle">MODERATOR · PLANS</text>
    <rect x="262" y="590" width="156" height="30" rx="15" fill="#0E1422" stroke="#3A4866" stroke-width="1"/>
    <text x="340" y="609" class="mono ringlabel" text-anchor="middle">UTILITY · THE BOARD</text>
  </g>

  <!-- ================= RIGHT: FOUR PRODUCTS ================= -->
  <!-- I. FRAMING -->
  <g transform="translate(640,176)">
    <rect width="496" height="96" rx="12" fill="#121826" stroke="#283349"/>
    <rect x="0" y="0" width="3.5" height="96" rx="1.75" fill="#F5C542"/>
    <text x="24" y="30" class="mono meta">I</text>
    <text x="54" y="31" class="sans cardtitle">Framing</text>
    <text x="54" y="55" class="sans cardbody">The moderator writes the plan: the deliverable, the question,</text>
    <text x="54" y="74" class="sans cardbody">the options, who leads and who supports, a lens per seat.</text>
    <text x="472" y="31" class="mono chip" text-anchor="end">plan · estimate</text>
  </g>

  <!-- II. ROUNDS -->
  <g transform="translate(640,288)">
    <rect width="496" height="96" rx="12" fill="#121826" stroke="#283349"/>
    <rect x="0" y="0" width="3.5" height="96" rx="1.75" fill="#60A5FA"/>
    <text x="24" y="30" class="mono meta">II</text>
    <text x="54" y="31" class="sans cardtitle">Rounds</text>
    <text x="54" y="55" class="sans cardbody">Independent positions in parallel, then cross-examination with</text>
    <text x="54" y="74" class="sans cardbody">tools: search, claim checks, attachments, files, a sandboxed shell.</text>
    <text x="472" y="31" class="mono chip" text-anchor="end">positions · cross-exam</text>
  </g>

  <!-- III. BOARD -->
  <g transform="translate(640,400)">
    <rect width="496" height="96" rx="12" fill="#121826" stroke="#283349"/>
    <rect x="0" y="0" width="3.5" height="96" rx="1.75" fill="#34D399"/>
    <text x="24" y="30" class="mono meta">III</text>
    <text x="54" y="31" class="sans cardtitle">Board</text>
    <text x="54" y="55" class="sans cardbody">Rewritten after every round: what is settled, what is disputed,</text>
    <text x="54" y="74" class="sans cardbody">the evidence, the open questions; the moderator judges convergence.</text>
    <text x="472" y="31" class="mono chip" text-anchor="end">settled · disputed</text>
  </g>

  <!-- IV. RECORD -->
  <g transform="translate(640,512)">
    <rect width="496" height="96" rx="12" fill="#121826" stroke="#283349"/>
    <rect x="0" y="0" width="3.5" height="96" rx="1.75" fill="#F472B6"/>
    <text x="24" y="30" class="mono meta">IV</text>
    <text x="54" y="31" class="sans cardtitle">Record</text>
    <text x="54" y="55" class="sans cardbody">The answer with its confidence, the votes, the dissent and why</text>
    <text x="54" y="74" class="sans cardbody">it lost, what changed, evidence, next actions, a hand-off folder.</text>
    <text x="472" y="31" class="mono chip" text-anchor="end">record · hand-off</text>
  </g>

  <!-- footer -->
  <line x1="64" y1="630" x2="1136" y2="630" stroke="#222B3F"/>
  <text x="64" y="650" class="mono footer">8 PROVIDERS · ANY MODEL PER SEAT · ONE RUST ENGINE</text>
  <text x="1136" y="650" class="mono footer" text-anchor="end">EVERYTHING RUNS LOCALLY</text>
</svg>
