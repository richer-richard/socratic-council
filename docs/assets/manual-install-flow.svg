<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Manual install: chapter index</title>
  <desc id="desc">A typeset chapter index of the seven manual install steps. Each chapter has a Roman numeral, an editorial title, a one-sentence purpose, and a representative shell command set in monospace.</desc>
  <defs>
    <radialGradient id="page" cx="50%" cy="48%" r="78%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#080a10"/>
      <stop offset="100%" stop-color="#04050a"/>
    </radialGradient>
    <pattern id="dotgrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#1c2434" fill-opacity="0.55"/>
    </pattern>
    <style>
      .display { font-family: 'Cormorant Garamond', 'Hoefler Text', Garamond, 'Times New Roman', serif; }
      .body    { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; }
      .mono    { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
      .ink     { fill: #ecf0f6; }
      .body-c  { fill: #b9c2d6; }
      .muted   { fill: #5d667a; }
      .gold    { fill: #f5c542; }
      .stroke-hair { stroke: #20283c; stroke-width: 1; fill: none; }
      .stroke-hair-strong { stroke: #344166; stroke-width: 1.2; fill: none; }
      .stroke-rule { stroke: #1a2233; stroke-width: 1; fill: none; }
      .leader { stroke: #2a3550; stroke-width: 1; stroke-dasharray: 1 4; fill: none; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#page)"/>
  <rect width="1280" height="720" fill="url(#dotgrid)"/>

  <!-- masthead -->
  <line x1="64" y1="60" x2="1216" y2="60" class="stroke-hair"/>
  <text x="64" y="48" class="mono ink" font-size="10" font-weight="600" letter-spacing="2">FIG. 07 / MANUAL</text>
  <text x="1216" y="48" class="mono muted" font-size="10" letter-spacing="2" text-anchor="end">build from source · all platforms</text>

  <!-- title -->
  <text x="64" y="118" class="display ink" font-style="italic" font-size="48">A Reader's Guide</text>
  <text x="64" y="148" class="body body-c" font-size="13">Seven chapters, in order. Read each one through, run its commands, then turn the page. Anything you skip will turn up later, asking for attention.</text>

  <!-- contents header -->
  <line x1="64" y1="198" x2="1216" y2="198" class="stroke-hair-strong"/>
  <text x="64" y="220" class="mono muted" font-size="10" letter-spacing="2">CONTENTS</text>
  <text x="1216" y="220" class="mono muted" font-size="10" letter-spacing="2" text-anchor="end">SHELL · POSIX</text>
  <line x1="64" y1="232" x2="1216" y2="232" class="stroke-rule"/>

  <!-- ============ CHAPTERS ============ -->
  <!-- Each row: Roman numeral (left), title + caption (mid), command (right mono) -->

  <!-- I -->
  <g transform="translate(0,272)">
    <text x="80"  y="0" class="display ink" font-style="italic" font-size="34" text-anchor="middle">I</text>
    <text x="160" y="-6" class="display ink" font-style="italic" font-size="22">System prerequisites</text>
    <text x="160" y="16" class="body body-c" font-size="11.5">OS-level packages that Tauri needs to compile and embed a WebView.</text>
    <line x1="552" y1="-2" x2="800" y2="-2" class="leader"/>
    <text x="1216" y="-6" class="mono ink" font-size="11" letter-spacing="0.5" text-anchor="end">xcode-select --install</text>
    <text x="1216" y="14" class="mono muted" font-size="10" text-anchor="end">apt · dnf · pacman alternatives</text>
  </g>
  <line x1="64" y1="306" x2="1216" y2="306" class="stroke-rule"/>

  <!-- II -->
  <g transform="translate(0,346)">
    <text x="80"  y="0" class="display ink" font-style="italic" font-size="34" text-anchor="middle">II</text>
    <text x="160" y="-6" class="display ink" font-style="italic" font-size="22">Node.js, version 22 or later</text>
    <text x="160" y="16" class="body body-c" font-size="11.5">Frontend toolchain runtime, and the host of corepack.</text>
    <line x1="552" y1="-2" x2="800" y2="-2" class="leader"/>
    <text x="1216" y="-6" class="mono ink" font-size="11" letter-spacing="0.5" text-anchor="end">nvm install 22</text>
    <text x="1216" y="14" class="mono muted" font-size="10" text-anchor="end">or fnm install 22</text>
  </g>
  <line x1="64" y1="380" x2="1216" y2="380" class="stroke-rule"/>

  <!-- III -->
  <g transform="translate(0,420)">
    <text x="80"  y="0" class="display ink" font-style="italic" font-size="34" text-anchor="middle">III</text>
    <text x="160" y="-6" class="display ink" font-style="italic" font-size="22">Rust, stable channel</text>
    <text x="160" y="16" class="body body-c" font-size="11.5">Compiler and cargo for the Tauri backend. Version 1.77.2 or newer.</text>
    <line x1="552" y1="-2" x2="800" y2="-2" class="leader"/>
    <text x="1216" y="-6" class="mono ink" font-size="11" letter-spacing="0.5" text-anchor="end">curl ... | sh</text>
    <text x="1216" y="14" class="mono muted" font-size="10" text-anchor="end">rustup default stable</text>
  </g>
  <line x1="64" y1="454" x2="1216" y2="454" class="stroke-rule"/>

  <!-- IV (gold accent) -->
  <g transform="translate(0,494)">
    <text x="80"  y="0" class="display gold" font-style="italic" font-size="34" text-anchor="middle">IV</text>
    <text x="160" y="-6" class="display ink" font-style="italic" font-size="22">Pin pnpm via corepack</text>
    <text x="160" y="16" class="body body-c" font-size="11.5">The repo pins pnpm 9.15.0 in <tspan class="mono" fill="#9ba6bf">package.json</tspan>; corepack obeys.</text>
    <line x1="552" y1="-2" x2="800" y2="-2" class="leader"/>
    <text x="1216" y="-6" class="mono gold" font-size="11" letter-spacing="0.5" text-anchor="end">corepack enable</text>
    <text x="1216" y="14" class="mono muted" font-size="10" text-anchor="end">pnpm -v   # 9.15.0</text>
  </g>
  <line x1="64" y1="528" x2="1216" y2="528" class="stroke-rule"/>

  <!-- V -->
  <g transform="translate(0,568)">
    <text x="80"  y="0" class="display ink" font-style="italic" font-size="34" text-anchor="middle">V</text>
    <text x="160" y="-6" class="display ink" font-style="italic" font-size="22">Clone and install</text>
    <text x="160" y="16" class="body body-c" font-size="11.5">Resolve the workspace and download every JavaScript dependency.</text>
    <line x1="552" y1="-2" x2="800" y2="-2" class="leader"/>
    <text x="1216" y="-6" class="mono ink" font-size="11" letter-spacing="0.5" text-anchor="end">git clone &amp; cd</text>
    <text x="1216" y="14" class="mono muted" font-size="10" text-anchor="end">pnpm install</text>
  </g>
  <line x1="64" y1="602" x2="1216" y2="602" class="stroke-rule"/>

  <!-- VI -->
  <g transform="translate(0,642)">
    <text x="80"  y="0" class="display ink" font-style="italic" font-size="34" text-anchor="middle">VI</text>
    <text x="160" y="-6" class="display ink" font-style="italic" font-size="22">Run, hot-reload</text>
    <text x="160" y="16" class="body body-c" font-size="11.5">Launches Vite, compiles Rust, opens the desktop window.</text>
    <line x1="552" y1="-2" x2="800" y2="-2" class="leader"/>
    <text x="1216" y="-6" class="mono ink" font-size="11" letter-spacing="0.5" text-anchor="end">pnpm tauri:dev</text>
    <text x="1216" y="14" class="mono muted" font-size="10" text-anchor="end">first run: 5–15 min</text>
  </g>
  <line x1="64" y1="676" x2="1216" y2="676" class="stroke-rule"/>

  <!-- VII -->
  <g transform="translate(0,710)">
    <text x="80"  y="0" class="display ink" font-style="italic" font-size="34" text-anchor="middle">VII</text>
    <text x="160" y="-6" class="display ink" font-style="italic" font-size="20">Bundle for distribution</text>
    <line x1="552" y1="-2" x2="800" y2="-2" class="leader"/>
    <text x="1216" y="-6" class="mono ink" font-size="11" letter-spacing="0.5" text-anchor="end">pnpm tauri:build</text>
  </g>
</svg>
