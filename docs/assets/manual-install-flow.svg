<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Manual install flow</title>
  <desc id="desc">Seven step cards in reading order — system prerequisites, Node, Rust, pnpm, clone and install, dev mode, production build — ending at a gold verification card with the eight-point checklist.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .h1   { fill: #F2F5FA; font-size: 27px; font-weight: 700; letter-spacing: -0.3px; }
      .sub  { fill: #97A2B8; font-size: 14px; }
      .tag  { fill: #F5C542; font-size: 11px; font-weight: 600; letter-spacing: 2.6px; }
      .meta { fill: #6B7690; font-size: 11px; letter-spacing: 2px; }
      .num   { fill: #F5C542; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
      .title2{ fill: #ECF0F6; font-size: 15.5px; font-weight: 650; }
      .body2 { fill: #A6B0C5; font-size: 12px; }
      .cmd2  { fill: #8B96AD; font-size: 11.5px; }
      .footer{ fill: #6B7690; font-size: 11px; letter-spacing: 1.8px; }
      .edge  { stroke: #516080; stroke-width: 1.5; fill: none; }
      .edgegold { stroke: #F5C542; stroke-width: 1.8; fill: none; }
    </style>
    <radialGradient id="bgGlow6" cx="50%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#11182A"/>
      <stop offset="100%" stop-color="#0A0E16"/>
    </radialGradient>
    <marker id="arr6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#516080"/>
    </marker>
    <marker id="arrGold6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F5C542"/>
    </marker>
  </defs>

  <rect width="1200" height="640" rx="18" fill="url(#bgGlow6)"/>
  <rect x="0.5" y="0.5" width="1199" height="639" rx="18" fill="none" stroke="#222B3F"/>

  <!-- masthead -->
  <text x="64" y="58" class="mono tag">SOCRATIC COUNCIL</text>
  <text x="1136" y="58" class="mono meta" text-anchor="end">FIG. 06 — MANUAL INSTALL</text>
  <text x="64" y="98" class="sans h1">Seven steps, any platform</text>
  <text x="64" y="126" class="sans sub">Each step has full per-OS instructions and verification commands in the guide below.</text>

  <!-- ============ ROW 1 ============ -->
  <g transform="translate(64,176)">
    <rect width="250" height="128" rx="12" fill="#121826" stroke="#283349"/>
    <text x="18" y="30" class="mono num">STEP 1</text>
    <text x="18" y="54" class="sans title2">System prereqs</text>
    <text x="18" y="78" class="sans body2">Xcode CLT · MSVC + WebView2 ·</text>
    <text x="18" y="94" class="sans body2">webkit2gtk (per distro)</text>
    <text x="18" y="116" class="mono cmd2">xcode-select --install</text>
  </g>
  <line x1="314" y1="240" x2="334" y2="240" class="edge" marker-end="url(#arr6)"/>

  <g transform="translate(338,176)">
    <rect width="250" height="128" rx="12" fill="#121826" stroke="#283349"/>
    <text x="18" y="30" class="mono num">STEP 2</text>
    <text x="18" y="54" class="sans title2">Node.js ≥ 22</text>
    <text x="18" y="78" class="sans body2">Runs the frontend toolchain;</text>
    <text x="18" y="94" class="sans body2">ships corepack for step 4.</text>
    <text x="18" y="116" class="mono cmd2">nvm install 22</text>
  </g>
  <line x1="588" y1="240" x2="608" y2="240" class="edge" marker-end="url(#arr6)"/>

  <g transform="translate(612,176)">
    <rect width="250" height="128" rx="12" fill="#121826" stroke="#283349"/>
    <text x="18" y="30" class="mono num">STEP 3</text>
    <text x="18" y="54" class="sans title2">Rust ≥ 1.77.2</text>
    <text x="18" y="78" class="sans body2">Compiles the Tauri v2 native</text>
    <text x="18" y="94" class="sans body2">backend (stable toolchain).</text>
    <text x="18" y="116" class="mono cmd2">curl https://sh.rustup.rs | sh</text>
  </g>
  <line x1="862" y1="240" x2="882" y2="240" class="edge" marker-end="url(#arr6)"/>

  <g transform="translate(886,176)">
    <rect width="250" height="128" rx="12" fill="#121826" stroke="#283349"/>
    <text x="18" y="30" class="mono num">STEP 4</text>
    <text x="18" y="54" class="sans title2">pnpm 9.15.0</text>
    <text x="18" y="78" class="sans body2">Exact version pinned by the</text>
    <text x="18" y="94" class="sans body2">repo's packageManager field.</text>
    <text x="18" y="116" class="mono cmd2">corepack enable</text>
  </g>

  <!-- snake to row 2 -->
  <path d="M 1011 304 L 1011 322 L 189 322 L 189 340" class="edge" marker-end="url(#arr6)"/>

  <!-- ============ ROW 2 ============ -->
  <g transform="translate(64,344)">
    <rect width="250" height="128" rx="12" fill="#121826" stroke="#283349"/>
    <text x="18" y="30" class="mono num">STEP 5</text>
    <text x="18" y="54" class="sans title2">Clone + install</text>
    <text x="18" y="78" class="sans body2">Resolves all four workspace</text>
    <text x="18" y="94" class="sans body2">packages in one shot.</text>
    <text x="18" y="116" class="mono cmd2">git clone … &amp;&amp; pnpm install</text>
  </g>
  <line x1="314" y1="408" x2="334" y2="408" class="edge" marker-end="url(#arr6)"/>

  <g transform="translate(338,344)">
    <rect width="250" height="128" rx="12" fill="#121826" stroke="#283349"/>
    <text x="18" y="30" class="mono num">STEP 6</text>
    <text x="18" y="54" class="sans title2">Run dev mode</text>
    <text x="18" y="78" class="sans body2">Vite HMR + cargo build; first</text>
    <text x="18" y="94" class="sans body2">run compiles ~300 crates.</text>
    <text x="18" y="116" class="mono cmd2">pnpm … tauri:dev</text>
  </g>
  <line x1="588" y1="408" x2="608" y2="408" class="edge" marker-end="url(#arr6)"/>

  <g transform="translate(612,344)">
    <rect width="250" height="128" rx="12" fill="#121826" stroke="#283349"/>
    <text x="18" y="30" class="mono num">STEP 7</text>
    <text x="18" y="54" class="sans title2">Production build</text>
    <text x="18" y="78" class="sans body2">LTO release binary, bundled</text>
    <text x="18" y="94" class="sans body2">per platform (.app/.msi/.deb).</text>
    <text x="18" y="116" class="mono cmd2">pnpm … tauri:build</text>
  </g>
  <line x1="862" y1="408" x2="882" y2="408" class="edgegold" marker-end="url(#arrGold6)"/>

  <g transform="translate(886,344)">
    <rect width="250" height="128" rx="12" fill="#161408" stroke="#F5C542" stroke-width="1.2"/>
    <text x="18" y="30" class="mono num">VERIFY</text>
    <text x="18" y="54" class="sans title2">8-point checklist</text>
    <text x="18" y="78" class="sans body2">git · node · pnpm · rustc ·</text>
    <text x="18" y="94" class="sans body2">cargo · tauri · workspace · OS libs</text>
    <text x="18" y="116" class="mono cmd2">README → verification</text>
  </g>

  <!-- footer -->
  <line x1="64" y1="540" x2="1136" y2="540" stroke="#222B3F"/>
  <text x="64" y="566" class="mono footer">FIRST CARGO BUILD: 5–15 MIN (COLD CACHE) · AFTER THAT: INCREMENTAL</text>
  <text x="1136" y="566" class="mono footer" text-anchor="end">WINDOWS NEEDS stable-msvc</text>
  <text x="64" y="592" class="sans body2">If a step fails, jump to the matching entry in Troubleshooting — every common error has a documented fix.</text>
</svg>
