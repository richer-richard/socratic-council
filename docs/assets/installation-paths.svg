<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Installation paths</title>
  <desc id="desc">Two parallel rails. The express rail is the macOS quick install via install.sh. The local rail is the manual install with seven stops, available on macOS, Windows, and Linux.</desc>
  <defs>
    <radialGradient id="page" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#080a10"/>
      <stop offset="100%" stop-color="#04050a"/>
    </radialGradient>
    <pattern id="dotgrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#1c2434" fill-opacity="0.55"/>
    </pattern>
    <style>
      .display { font-family: 'Cormorant Garamond', 'Hoefler Text', Garamond, 'Times New Roman', serif; }
      .body    { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; }
      .mono    { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
      .ink     { fill: #ecf0f6; }
      .body-c  { fill: #b9c2d6; }
      .muted   { fill: #5d667a; }
      .gold    { fill: #f5c542; }
      .stroke-hair { stroke: #20283c; stroke-width: 1; fill: none; }
      .stroke-hair-strong { stroke: #344166; stroke-width: 1.2; fill: none; }
      .stroke-rule { stroke: #1a2233; stroke-width: 1; fill: none; }
      .rail-gold { stroke: #f5c542; stroke-width: 2; fill: none; }
      .rail-bone { stroke: #4a5878; stroke-width: 1.4; fill: none; }
      .rail-tie  { stroke: #2a3550; stroke-width: 1; fill: none; }
      .stop-dot     { fill: #0a0e16; stroke: #4a5878; stroke-width: 1.4; }
      .stop-dot-gold { fill: #100c04; stroke: #f5c542; stroke-width: 1.6; }
    </style>
  </defs>

  <rect width="1280" height="480" fill="url(#page)"/>
  <rect width="1280" height="480" fill="url(#dotgrid)"/>

  <!-- masthead -->
  <line x1="64" y1="60" x2="1216" y2="60" class="stroke-hair"/>
  <text x="64" y="48" class="mono ink" font-size="10" font-weight="600" letter-spacing="2">FIG. 05 / INSTALL</text>
  <text x="1216" y="48" class="mono muted" font-size="10" letter-spacing="2" text-anchor="end">two rails to the same station</text>

  <!-- title -->
  <text x="64" y="118" class="display ink" font-style="italic" font-size="44">Pick a Rail</text>
  <text x="64" y="146" class="body body-c" font-size="13">The express rail (macOS only) does the work for you. The local rail keeps every step under your hand.</text>

  <!-- ============ EXPRESS RAIL (top) ============ -->
  <g transform="translate(96,228)">
    <text x="0" y="-22" class="mono gold" font-size="10" letter-spacing="2">EXPRESS · macOS only</text>
    <text x="0" y="-2"  class="display ink" font-style="italic" font-size="22">Quick install via install.sh</text>

    <!-- gold rail -->
    <line x1="160" y1="20" x2="1080" y2="20" class="rail-gold"/>

    <!-- 3 stops -->
    <circle cx="160"  cy="20" r="9" class="stop-dot-gold"/>
    <circle cx="620"  cy="20" r="9" class="stop-dot-gold"/>
    <circle cx="1080" cy="20" r="9" class="stop-dot-gold"/>

    <!-- stop labels -->
    <text x="160" y="-4"  class="mono muted" font-size="9.5" letter-spacing="1.6" text-anchor="middle">START</text>
    <text x="160" y="46"  class="body body-c" font-size="11.5" text-anchor="middle">clone the repo</text>

    <text x="620" y="-4"  class="mono muted" font-size="9.5" letter-spacing="1.6" text-anchor="middle">RUN</text>
    <text x="620" y="46"  class="body body-c" font-size="11.5" text-anchor="middle">./install.sh</text>
    <text x="620" y="62"  class="body muted" font-size="11">checks deps · builds · signs</text>

    <text x="1080" y="-4"  class="mono muted" font-size="9.5" letter-spacing="1.6" text-anchor="middle">ARRIVE</text>
    <text x="1080" y="46"  class="body body-c" font-size="11.5" text-anchor="middle">/Applications</text>
    <text x="1080" y="62"  class="body muted" font-size="11">app launches automatically</text>
  </g>

  <!-- ============ LOCAL RAIL (bottom) ============ -->
  <g transform="translate(96,348)">
    <text x="0" y="-22" class="mono muted" font-size="10" letter-spacing="2">LOCAL · macOS · Windows · Linux</text>
    <text x="0" y="-2"  class="display ink" font-style="italic" font-size="22">Manual install, seven stops</text>

    <!-- bone rail -->
    <line x1="160" y1="20" x2="1080" y2="20" class="rail-bone"/>

    <!-- 7 stops evenly spaced from 160 to 1080 (920 / 6 = ~153.33 per gap) -->
    <!-- Stop x-positions: 160, 313, 467, 620, 773, 927, 1080 -->
    <g>
      <circle cx="160"  cy="20" r="7" class="stop-dot"/>
      <circle cx="313"  cy="20" r="7" class="stop-dot"/>
      <circle cx="467"  cy="20" r="7" class="stop-dot"/>
      <circle cx="620"  cy="20" r="7" class="stop-dot"/>
      <circle cx="773"  cy="20" r="7" class="stop-dot"/>
      <circle cx="927"  cy="20" r="7" class="stop-dot"/>
      <circle cx="1080" cy="20" r="7" class="stop-dot"/>
    </g>

    <!-- vertical platform ticks -->
    <g class="rail-tie">
      <line x1="160"  y1="38" x2="160"  y2="48"/>
      <line x1="313"  y1="38" x2="313"  y2="48"/>
      <line x1="467"  y1="38" x2="467"  y2="48"/>
      <line x1="620"  y1="38" x2="620"  y2="48"/>
      <line x1="773"  y1="38" x2="773"  y2="48"/>
      <line x1="927"  y1="38" x2="927"  y2="48"/>
      <line x1="1080" y1="38" x2="1080" y2="48"/>
    </g>

    <!-- stop captions -->
    <g font-size="11">
      <g text-anchor="middle">
        <text x="160"  y="-2" class="mono muted" font-size="9.5" letter-spacing="1.4">01</text>
        <text x="313"  y="-2" class="mono muted" font-size="9.5" letter-spacing="1.4">02</text>
        <text x="467"  y="-2" class="mono muted" font-size="9.5" letter-spacing="1.4">03</text>
        <text x="620"  y="-2" class="mono muted" font-size="9.5" letter-spacing="1.4">04</text>
        <text x="773"  y="-2" class="mono muted" font-size="9.5" letter-spacing="1.4">05</text>
        <text x="927"  y="-2" class="mono muted" font-size="9.5" letter-spacing="1.4">06</text>
        <text x="1080" y="-2" class="mono muted" font-size="9.5" letter-spacing="1.4">07</text>

        <text x="160"  y="68" class="body body-c">prerequisites</text>
        <text x="313"  y="68" class="body body-c">Node.js 22+</text>
        <text x="467"  y="68" class="body body-c">Rust stable</text>
        <text x="620"  y="68" class="body body-c">corepack</text>
        <text x="773"  y="68" class="body body-c">pnpm install</text>
        <text x="927"  y="68" class="body body-c">tauri:dev</text>
        <text x="1080" y="68" class="body body-c">tauri:build</text>

        <text x="160"  y="84" class="body muted" font-size="10.5">OS deps</text>
        <text x="313"  y="84" class="body muted" font-size="10.5">via nvm/fnm</text>
        <text x="467"  y="84" class="body muted" font-size="10.5">≥ 1.77.2</text>
        <text x="620"  y="84" class="body muted" font-size="10.5">pinned 9.15.0</text>
        <text x="773"  y="84" class="body muted" font-size="10.5">workspace deps</text>
        <text x="927"  y="84" class="body muted" font-size="10.5">hot-reload</text>
        <text x="1080" y="84" class="body muted" font-size="10.5">.app / .msi / .deb</text>
      </g>
    </g>
  </g>

  <!-- footer -->
  <line x1="64" y1="438" x2="1216" y2="438" class="stroke-hair"/>
  <text x="64" y="460" class="mono muted" font-size="9.5" letter-spacing="2">SAME DESTINATION · DIFFERENT PACE</text>
  <text x="1216" y="460" class="display muted" font-size="13" font-style="italic" text-anchor="end">no train pulls into a wrong station</text>
</svg>
