<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Installation paths</title>
  <desc id="desc">Three lanes. The quick path runs install.sh on macOS and ends with the app in Applications. The manual path walks seven steps on macOS, Windows, or Linux. The third lane installs the terminal CLI with one cargo command.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .h1   { fill: #F2F5FA; font-size: 27px; font-weight: 700; letter-spacing: -0.3px; }
      .sub  { fill: #97A2B8; font-size: 14px; }
      .tag  { fill: #F5C542; font-size: 11px; font-weight: 600; letter-spacing: 2.6px; }
      .meta { fill: #6B7690; font-size: 11px; letter-spacing: 2px; }
      .lanetag  { fill: #6B7690; font-size: 10.5px; letter-spacing: 2px; }
      .cmd      { fill: #ECF0F6; font-size: 14.5px; font-weight: 600; }
      .cmdnote  { fill: #97A2B8; font-size: 12px; }
      .midtext  { fill: #A6B0C5; font-size: 13px; }
      .outname  { fill: #ECF0F6; font-size: 14.5px; font-weight: 650; }
      .outnote  { fill: #97A2B8; font-size: 11.5px; }
      .footer   { fill: #6B7690; font-size: 11px; letter-spacing: 1.8px; }
      .edgegold { stroke: #F5C542; stroke-width: 1.8; fill: none; }
      .edge     { stroke: #516080; stroke-width: 1.5; fill: none; }
    </style>
    <radialGradient id="bgGlow5" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#11182A"/>
      <stop offset="100%" stop-color="#0A0E16"/>
    </radialGradient>
    <marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#516080"/>
    </marker>
    <marker id="arrGold5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F5C542"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="18" fill="url(#bgGlow5)"/>
  <rect x="0.5" y="0.5" width="1199" height="559" rx="18" fill="none" stroke="#222B3F"/>

  <!-- masthead -->
  <text x="64" y="58" class="mono tag">SOCRATIC COUNCIL</text>
  <text x="1136" y="58" class="mono meta" text-anchor="end">FIG. 05 — INSTALLATION</text>
  <text x="64" y="98" class="sans h1">Three ways in</text>
  <text x="64" y="126" class="sans sub">One script, one walkthrough, or one cargo command for the terminal sibling.</text>

  <!-- ============ LANE A: QUICK ============ -->
  <text x="64" y="180" class="mono lanetag">A · QUICK INSTALL — MACOS</text>
  <g transform="translate(64,192)">
    <rect width="312" height="84" rx="12" fill="#161408" stroke="#F5C542" stroke-width="1.2"/>
    <text x="20" y="34" class="mono cmd">./install.sh</text>
    <text x="20" y="58" class="sans cmdnote">checks + installs Xcode CLT, Homebrew,</text>
    <text x="20" y="74" class="sans cmdnote">Node 22, pnpm, Rust — then builds</text>
  </g>
  <line x1="376" y1="234" x2="430" y2="234" class="edgegold" marker-end="url(#arrGold5)"/>
  <g transform="translate(434,192)">
    <rect width="380" height="84" rx="12" fill="#121826" stroke="#283349"/>
    <text x="20" y="34" class="sans midtext">Production build → copies the app into</text>
    <text x="20" y="54" class="sans midtext">/Applications → launches it. Skips any</text>
    <text x="20" y="74" class="sans midtext">tool you already have.</text>
  </g>
  <line x1="814" y1="234" x2="868" y2="234" class="edgegold" marker-end="url(#arrGold5)"/>
  <g transform="translate(872,192)">
    <rect width="264" height="84" rx="12" fill="#121826" stroke="#F5C542" stroke-width="1"/>
    <text x="20" y="38" class="sans outname">Socratic Council.app</text>
    <text x="20" y="60" class="sans outnote">installed + opened automatically</text>
  </g>

  <!-- ============ LANE B: MANUAL ============ -->
  <text x="64" y="320" class="mono lanetag">B · MANUAL INSTALL — MACOS · WINDOWS · LINUX</text>
  <g transform="translate(64,332)">
    <rect width="312" height="84" rx="12" fill="#121826" stroke="#283349"/>
    <text x="20" y="34" class="mono cmd">steps 1–7</text>
    <text x="20" y="58" class="sans cmdnote">system prereqs · Node ≥ 22 · Rust ≥ 1.77.2</text>
    <text x="20" y="74" class="sans cmdnote">pnpm 9.15 · clone · dev · build</text>
  </g>
  <line x1="376" y1="374" x2="430" y2="374" class="edge" marker-end="url(#arr5)"/>
  <g transform="translate(434,332)">
    <rect width="380" height="84" rx="12" fill="#121826" stroke="#283349"/>
    <text x="20" y="34" class="sans midtext">Full control of every dependency and</text>
    <text x="20" y="54" class="sans midtext">build flag — ends in a reusable local</text>
    <text x="20" y="74" class="sans midtext">development + release environment.</text>
  </g>
  <line x1="814" y1="374" x2="868" y2="374" class="edge" marker-end="url(#arr5)"/>
  <g transform="translate(872,332)">
    <rect width="264" height="84" rx="12" fill="#121826" stroke="#283349"/>
    <text x="20" y="38" class="sans outname">.app · .msi · .deb · …</text>
    <text x="20" y="60" class="sans outnote">platform bundle + dev environment</text>
  </g>

  <!-- ============ LANE C: CLI ============ -->
  <text x="64" y="460" class="mono lanetag">C · TERMINAL CLI — ANYWHERE, EVEN A HEADLESS VPS</text>
  <g transform="translate(64,472)">
    <rect width="442" height="52" rx="12" fill="#121826" stroke="#283349"/>
    <text x="20" y="32" class="mono cmd">cargo install socratic-council</text>
  </g>
  <line x1="506" y1="498" x2="560" y2="498" class="edge" marker-end="url(#arr5)"/>
  <g transform="translate(564,472)">
    <rect width="572" height="52" rx="12" fill="#121826" stroke="#283349"/>
    <text x="20" y="32" class="sans midtext">One static binary — the full debate TUI, no Node, no clone, no desktop app required.</text>
  </g>

</svg>
