<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Architecture: Socratic Council</title>
  <desc id="desc">Three columns: the Tauri desktop app whose Rust backend hosts the engine and brokers every outbound byte, the socratic-council-engine crate in the middle that runs the deliberation for both surfaces, and the standalone Rust CLI with its read-only bridge into the desktop vault. All paths end at the eight provider APIs along the bottom.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .h1   { fill: #F2F5FA; font-size: 27px; font-weight: 700; letter-spacing: -0.3px; }
      .sub  { fill: #97A2B8; font-size: 14px; }
      .tag  { fill: #F5C542; font-size: 11px; font-weight: 600; letter-spacing: 2.6px; }
      .meta { fill: #6B7690; font-size: 11px; letter-spacing: 2px; }
      .colhead  { fill: #8B96AD; font-size: 11px; letter-spacing: 2px; }
      .boxtitle { fill: #ECF0F6; font-size: 15.5px; font-weight: 650; }
      .boxbody  { fill: #A6B0C5; font-size: 12.5px; }
      .boxmono  { fill: #8B96AD; font-size: 11px; }
      .gold     { fill: #F5C542; }
      .prov     { fill: #C7CFDD; font-size: 12.5px; }
      .footer   { fill: #6B7690; font-size: 11px; letter-spacing: 1.8px; }
      .edge     { stroke: #516080; stroke-width: 1.5; fill: none; }
      .edgegold { stroke: #F5C542; stroke-width: 1.8; fill: none; }
      .edgedash { stroke: #516080; stroke-width: 1.4; fill: none; stroke-dasharray: 5 5; }
    </style>
    <radialGradient id="bgGlow2" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#11182A"/>
      <stop offset="100%" stop-color="#0A0E16"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#516080"/>
    </marker>
    <marker id="arrGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F5C542"/>
    </marker>
  </defs>

  <rect width="1200" height="780" rx="18" fill="url(#bgGlow2)"/>
  <rect x="0.5" y="0.5" width="1199" height="779" rx="18" fill="none" stroke="#222B3F"/>

  <!-- masthead -->
  <text x="64" y="58" class="mono tag">SOCRATIC COUNCIL</text>
  <text x="1136" y="58" class="mono meta" text-anchor="end">FIG. 02 — ARCHITECTURE</text>
  <text x="64" y="98" class="sans h1">One engine, two surfaces, one gate</text>
  <text x="64" y="126" class="sans sub">The desktop app and the terminal CLI host the same Rust engine crate, share one encrypted store, and reach the providers only from Rust.</text>

  <!-- column heads -->
  <text x="64"  y="172" class="mono colhead">DESKTOP APP · apps/desktop</text>
  <text x="440" y="172" class="mono colhead">ENGINE · engine/</text>
  <text x="820" y="172" class="mono colhead">TERMINAL CLI · cli/ (crates.io)</text>

  <!-- ===== LEFT: desktop (x 64..384) ===== -->
  <g transform="translate(64,188)">
    <rect width="320" height="104" rx="12" fill="#121826" stroke="#283349"/>
    <text x="20" y="32" class="sans boxtitle">React + TypeScript UI</text>
    <text x="20" y="56" class="sans boxbody">Home with presets and the deliverable,</text>
    <text x="20" y="74" class="sans boxbody">the Session page on the event reducer.</text>
    <text x="20" y="94" class="mono boxmono">Home · Session · ConfigModal · RosterEditor</text>
  </g>
  <line x1="224" y1="292" x2="224" y2="308" class="edge" marker-end="url(#arr)"/>
  <g transform="translate(64,308)">
    <rect width="320" height="96" rx="12" fill="#121826" stroke="#283349"/>
    <text x="20" y="30" class="sans boxtitle">Services &amp; stores</text>
    <text x="20" y="54" class="sans boxbody">Vault-encrypted secrets, sessions and</text>
    <text x="20" y="72" class="sans boxbody">attachments; bundles; the event stream.</text>
    <text x="20" y="88" class="mono boxmono">vault · secrets · sessions · engine.ts</text>
  </g>
  <line x1="224" y1="404" x2="224" y2="420" class="edge" marker-end="url(#arr)"/>
  <g transform="translate(64,420)">
    <rect width="320" height="158" rx="12" fill="#161408" stroke="#F5C542" stroke-width="1.2"/>
    <text x="20" y="32" class="sans boxtitle"><tspan class="gold">Rust backend</tspan> — src-tauri</text>
    <text x="20" y="56" class="sans boxbody">Hosts the engine. Every outbound byte</text>
    <text x="20" y="74" class="sans boxbody">passes one door:</text>
    <text x="20" y="98" class="mono boxmono">engine_host.rs start · input · cancel · scan</text>
    <text x="20" y="116" class="mono boxmono">allowlist.rs   https-only · hosts · 4 MB cap</text>
    <text x="20" y="134" class="mono boxmono">vault_file.rs  32-byte DEK · no OS keychain</text>
    <text x="20" y="152" class="mono boxmono">redact.rs      keys scrubbed from every error</text>
  </g>
  <g transform="translate(64,594)">
    <rect width="320" height="62" rx="12" fill="#0E1422" stroke="#283349" stroke-dasharray="6 4"/>
    <text x="20" y="26" class="sans boxtitle">packages/shared · packages/core</text>
    <text x="20" y="48" class="mono boxmono">event types · registry mirrors the catalog</text>
  </g>

  <!-- ===== MIDDLE: engine (x 424..776) ===== -->
  <g transform="translate(424,188)">
    <rect width="352" height="390" rx="12" fill="#121826" stroke="#3A4866"/>
    <text x="20" y="32" class="sans boxtitle">The deliberation, once</text>
    <text x="20" y="56" class="sans boxbody">One crate runs the protocol for both</text>
    <text x="20" y="74" class="sans boxbody">surfaces and emits one event stream.</text>
    <text x="20" y="104" class="mono boxmono"><tspan class="gold">deliberation/</tspan> plan · positions · cross-exam</text>
    <text x="20" y="122" class="mono boxmono">              board · convergence · revision</text>
    <text x="20" y="140" class="mono boxmono">              record · document · estimate</text>
    <text x="20" y="166" class="mono boxmono"><tspan class="gold">providers/</tspan>    8 endpoints · 4 wire styles</text>
    <text x="20" y="184" class="mono boxmono">              native tools · cached usage</text>
    <text x="20" y="210" class="mono boxmono"><tspan class="gold">catalog/</tspan>      verified contracts and prices</text>
    <text x="20" y="236" class="mono boxmono"><tspan class="gold">tools/</tspan>        policy · workspace · shell</text>
    <text x="20" y="254" class="mono boxmono">              web · attachments · fencing</text>
    <text x="20" y="280" class="mono boxmono"><tspan class="gold">search.rs</tspan>     DDG + Bing · Wikipedia · en-US</text>
    <text x="20" y="306" class="mono boxmono"><tspan class="gold">store.rs</tspan>      session file v2 · ENC1</text>
    <text x="20" y="332" class="mono boxmono"><tspan class="gold">handoff.rs</tspan>    brief · record · board · json</text>
    <text x="20" y="358" class="mono boxmono"><tspan class="gold">cost.rs</tspan>       estimate · ledger · caps</text>
  </g>
  <!-- desktop -> engine, cli -> engine -->
  <line x1="384" y1="470" x2="424" y2="470" class="edgegold" marker-end="url(#arrGold)"/>
  <line x1="816" y1="470" x2="776" y2="470" class="edgegold" marker-end="url(#arrGold)"/>

  <!-- ===== RIGHT: cli (x 816..1136) ===== -->
  <g transform="translate(816,188)">
    <rect width="320" height="252" rx="12" fill="#121826" stroke="#283349"/>
    <text x="20" y="32" class="sans boxtitle">socratic-council (Rust)</text>
    <text x="20" y="56" class="sans boxbody">The same workstation in a ratatui TUI,</text>
    <text x="20" y="74" class="sans boxbody">first-class on a headless VPS.</text>
    <text x="20" y="100" class="mono boxmono">tui/      Home · Session · Settings</text>
    <text x="20" y="118" class="mono boxmono">config.rs [[seats]] · [moderator]</text>
    <text x="20" y="136" class="mono boxmono">          [utility] · [tools] · [protocol]</text>
    <text x="20" y="154" class="mono boxmono">main.rs   run · sessions · handoff</text>
    <text x="20" y="172" class="mono boxmono">          search · models · probe · config</text>
    <text x="20" y="190" class="mono boxmono">crypto.rs XChaCha20 keys.enc · 0600</text>
    <text x="20" y="226" class="sans boxbody">cargo install socratic-council</text>
  </g>
  <line x1="976" y1="440" x2="976" y2="456" class="edge" marker-end="url(#arr)"/>
  <g transform="translate(816,456)">
    <rect width="320" height="84" rx="12" fill="#0E1422" stroke="#283349"/>
    <text x="20" y="30" class="sans boxtitle">Desktop bridge (optional)</text>
    <text x="20" y="52" class="sans boxbody">Reads the app's keys: read-only, no</text>
    <text x="20" y="70" class="sans boxbody">prompts. Sessions share the engine's store.</text>
  </g>
  <path d="M 976 540 L 976 604 L 720 604 L 720 578" class="edgedash" marker-end="url(#arr)"/>
  <text x="848" y="598" class="mono boxmono" text-anchor="middle">the same ENC1 vault</text>

  <!-- engine -> providers -->
  <line x1="600" y1="578" x2="600" y2="662" class="edgegold" marker-end="url(#arrGold)"/>
  <text x="590" y="630" class="mono boxmono" text-anchor="end">https only · from Rust only</text>

  <!-- providers strip -->
  <g transform="translate(64,662)">
    <rect width="1072" height="64" rx="12" fill="#0E1422" stroke="#283349"/>
    <g class="sans prov">
      <circle cx="36"  cy="32" r="5.5" fill="#60A5FA"/><text x="50"  y="37">OpenAI</text>
      <circle cx="166" cy="32" r="5.5" fill="#FBBF24"/><text x="180" y="37">Anthropic</text>
      <circle cx="316" cy="32" r="5.5" fill="#34D399"/><text x="330" y="37">Google</text>
      <circle cx="446" cy="32" r="5.5" fill="#F87171"/><text x="460" y="37">DeepSeek</text>
      <circle cx="592" cy="32" r="5.5" fill="#2DD4BF"/><text x="606" y="37">Kimi</text>
      <circle cx="694" cy="32" r="5.5" fill="#22D3EE"/><text x="708" y="37">Qwen</text>
      <circle cx="800" cy="32" r="5.5" fill="#F472B6"/><text x="814" y="37">MiniMax</text>
      <circle cx="938" cy="32" r="5.5" fill="#A78BFA"/><text x="952" y="37">Z.AI</text>
    </g>
  </g>

  <!-- footer -->
  <line x1="64" y1="746" x2="1136" y2="746" stroke="#222B3F"/>
  <text x="64" y="764" class="mono footer">LOCAL-FIRST · BYO API KEYS · APACHE-2.0</text>
  <text x="1136" y="764" class="mono footer" text-anchor="end">ONE ENGINE CRATE · pnpm WORKSPACE + CARGO WORKSPACE</text>
</svg>
