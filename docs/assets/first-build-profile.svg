<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">First-build profile</title>
  <desc id="desc">A horizontal duration chart of the four phases of a first production build on a fresh machine. The cold cargo compile dominates at five to fifteen minutes; everything else takes a minute or three. A note explains that subsequent builds are incremental.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .h1   { fill: #F2F5FA; font-size: 27px; font-weight: 700; letter-spacing: -0.3px; }
      .sub  { fill: #97A2B8; font-size: 14px; }
      .tag  { fill: #F5C542; font-size: 11px; font-weight: 600; letter-spacing: 2.6px; }
      .meta { fill: #6B7690; font-size: 11px; letter-spacing: 2px; }
      .axis    { fill: #6B7690; font-size: 11px; }
      .rowname { fill: #D7DEEA; font-size: 14px; font-weight: 600; }
      .rowsub  { fill: #8B96AD; font-size: 11.5px; }
      .dur     { fill: #C7D0E0; font-size: 12.5px; font-weight: 600; }
      .durgold { fill: #F5C542; font-size: 12.5px; font-weight: 700; }
      .footer  { fill: #6B7690; font-size: 11px; letter-spacing: 1.8px; }
    </style>
    <radialGradient id="bgGlow7" cx="50%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#11182A"/>
      <stop offset="100%" stop-color="#0A0E16"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="560" rx="18" fill="url(#bgGlow7)"/>
  <rect x="0.5" y="0.5" width="1199" height="559" rx="18" fill="none" stroke="#222B3F"/>

  <!-- masthead -->
  <text x="64" y="58" class="mono tag">SOCRATIC COUNCIL</text>
  <text x="1136" y="58" class="mono meta" text-anchor="end">FIG. 07 — FIRST BUILD</text>
  <text x="64" y="98" class="sans h1">Where the first build spends its time</text>
  <text x="64" y="126" class="sans sub">Illustrative shape for a fresh machine — the cold Cargo compile dominates, and it only happens once.</text>

  <!-- gridlines: plot x = 290..1130 (56 px / min, 0..15) -->
  <g stroke="#1B2335">
    <line x1="290"  y1="168" x2="290"  y2="448"/>
    <line x1="570"  y1="168" x2="570"  y2="448"/>
    <line x1="850"  y1="168" x2="850"  y2="448"/>
    <line x1="1130" y1="168" x2="1130" y2="448"/>
  </g>
  <g class="mono axis">
    <text x="290"  y="462" text-anchor="middle">0 min</text>
    <text x="570"  y="462" text-anchor="middle">5 min</text>
    <text x="850"  y="462" text-anchor="middle">10 min</text>
    <text x="1130" y="462" text-anchor="middle">15 min</text>
  </g>

  <!-- row 1: pnpm install -->
  <text x="64" y="204" class="sans rowname">pnpm install</text>
  <text x="64" y="222" class="mono rowsub">workspace deps</text>
  <rect x="290" y="190" width="56"  height="26" rx="6" fill="#60A5FA"/>
  <rect x="346" y="190" width="112" height="26" rx="6" fill="#60A5FA" opacity="0.35"/>
  <text x="470" y="208" class="sans dur">~1–3 min</text>

  <!-- row 2: workspace build -->
  <text x="64" y="274" class="sans rowname">TS workspace build</text>
  <text x="64" y="292" class="mono rowsub">tsup ×3 · tsc · vite</text>
  <rect x="290" y="260" width="56" height="26" rx="6" fill="#34D399"/>
  <rect x="346" y="260" width="56" height="26" rx="6" fill="#34D399" opacity="0.35"/>
  <text x="414" y="278" class="sans dur">~1–2 min</text>

  <!-- row 3: cargo cold compile (dominant, gold) -->
  <text x="64" y="344" class="sans rowname">Cargo cold compile</text>
  <text x="64" y="362" class="mono rowsub">~300 crates · LTO</text>
  <rect x="290" y="330" width="280" height="26" rx="6" fill="#F5C542"/>
  <rect x="570" y="330" width="560" height="26" rx="6" fill="#F5C542" opacity="0.28"/>
  <text x="852" y="348" class="sans durgold">~5–15 min — the long pole, once</text>

  <!-- row 4: bundle + sign -->
  <text x="64" y="414" class="sans rowname">Bundle + sign</text>
  <text x="64" y="432" class="mono rowsub">.app / .msi / .deb</text>
  <rect x="290" y="400" width="56" height="26" rx="6" fill="#F472B6"/>
  <rect x="346" y="400" width="56" height="26" rx="6" fill="#F472B6" opacity="0.35"/>
  <text x="414" y="418" class="sans dur">~1–2 min</text>

  <!-- legend -->
  <rect x="64" y="480" width="14" height="14" rx="4" fill="#516080"/>
  <text x="86" y="492" class="sans rowsub">typical</text>
  <rect x="150" y="480" width="14" height="14" rx="4" fill="#516080" opacity="0.35"/>
  <text x="172" y="492" class="sans rowsub">up to (slow machine / cold caches)</text>

  <!-- footer -->
  <line x1="64" y1="514" x2="1136" y2="514" stroke="#222B3F"/>
  <text x="64" y="536" class="mono footer">AFTER THE FIRST RUN: CARGO CACHE + VITE HMR → DEV RELOADS IN SECONDS</text>
  <text x="1136" y="536" class="mono footer" text-anchor="end">RELEASE BUILDS STAY SLOWER — LTO IS WORTH IT</text>
</svg>
