# cargo-audit policy for the CLI crate. Vulnerabilities are never ignored —
# only advisories with no fix reachable from our dependency tree, each with a
# reason and a revisit condition.

[advisories]
ignore = [
  # paste is unmaintained (archived); pulled in by ratatui's macro layer.
  # Build-time proc-macro only — no runtime or network surface. Revisit when
  # ratatui drops it (tracked upstream in ratatui#1517).
  "RUSTSEC-2024-0436",

  # lru < 0.16.1 has an unsound iterator (RUSTSEC-2026-0002) and an unsound
  # `LruCache::pop()` under panic (RUSTSEC-2026-0253). ratatui 0.29 pins
  # lru 0.12; neither API (mutable iteration, pop-during-panic) is exercised
  # by ratatui's cell cache. Both go away with the ratatui 0.30 migration,
  # which is deferred until the TUI redesign (see CLAUDE.local.md §9).
  "RUSTSEC-2026-0002",
  "RUSTSEC-2026-0253",
]
