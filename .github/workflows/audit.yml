name: Security audit

on:
  # Gate every PR so regressions in dependencies get caught at review time.
  pull_request:
  # Run at ~08:00 UTC daily — catches CVEs disclosed against already-merged deps.
  schedule:
    - cron: "0 8 * * *"
  # Allow a manual run from the Actions tab.
  workflow_dispatch:

# Read-only token: auditing never needs write access to the repo.
permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # Blocking gate: SHIPPED (prod) deps must carry no HIGH/CRITICAL advisory.
      # These ride inside the distributed app, so they hard-fail the build.
      - name: Run pnpm audit (prod — blocking)
        run: pnpm audit --audit-level=high --prod
      # Visibility: audit the FULL graph too (incl. devDependencies — eslint,
      # vitest, the build toolchain). Non-blocking, because clearing a dev-tool
      # advisory often needs a major version bump; surface it without wedging
      # every PR/cron red. (F12: dev-dep advisories must at least be visible.)
      - name: Run pnpm audit (full graph — informational)
        run: pnpm audit --audit-level=high || echo "::warning::dev-graph HIGH/CRITICAL advisories present (non-blocking)"

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        working-directory: apps/desktop/src-tauri
        # Fail on any security advisory. Ignored advisories live in
        # `.cargo/audit.toml` (cargo-audit's config path) next to the crate,
        # each with a documented reason and follow-up plan.
        run: cargo audit --deny warnings

  cargo-audit-cli:
    name: cargo audit (CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit on the CLI crate
        working-directory: cli
        run: cargo audit --deny warnings
