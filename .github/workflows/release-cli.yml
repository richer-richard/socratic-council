name: Release CLI

# Tag-driven CD for the standalone CLI crate (`cli/`): validate, build the
# binaries on all three OSes, attach them to the GitHub release, and publish to
# crates.io (skipped automatically when the version is already live — e.g.
# after a manual local publish).
#
# Supply-chain hardening: every third-party action is pinned to a full commit
# SHA. A mutable @tag / @branch ref could be moved to run attacker code inside a
# job that holds `CARGO_REGISTRY_TOKEN`, yielding a backdoored crate. The
# `publish` job additionally runs with a read-only `GITHUB_TOKEN` that is kept
# OFF the runner's git config (`persist-credentials: false`), so even a poisoned
# step can't recover a write-capable token.

on:
  push:
    tags: ["cli-v*"]

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; only the `release` job opts back up to contents: write.
permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Test (engine + CLI, default features)
        run: cargo test --locked --workspace
      - name: Test (CLI, no default features)
        run: cargo test --locked -p socratic-council --no-default-features
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p socratic-council --all-targets --locked --no-default-features -- -D warnings
      - name: Tag matches cli/Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          CRATE_VERSION=$(grep -m1 '^version' cli/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$CRATE_VERSION" ]; then
            echo "::error::tag $TAG_VERSION != Cargo.toml $CRATE_VERSION"
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          # Intel macOS cross-compiles from the arm64 runner — GitHub retired
          # the macos-13 (Intel) runners, so a native job queues forever.
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p socratic-council --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          BIN=target/${{ matrix.target }}/release/socratic-council
          tar -C "$(dirname "$BIN")" -czf "socratic-council-${GITHUB_REF_NAME#cli-v}-${{ matrix.target }}.tar.gz" socratic-council
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^cli-v',''
          Compress-Archive -Path "target/${{ matrix.target }}/release/socratic-council.exe" -DestinationPath "socratic-council-$version-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: |
            socratic-council-*.tar.gz
            socratic-council-*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only this job needs to write the release; scope the elevation to it.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the release
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "socratic-council CLI ${TAG#cli-v}" \
              --notes "Terminal multi-model deliberation workstation: a moderated council of frontier models that settles a question and leaves a decision record. Install with \`cargo install socratic-council\`, or grab a prebuilt binary below."
          fi
          gh release upload "$TAG" dist/* --clobber

  publish:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-latest
    # Inherits the top-level read-only token. The runner holds
    # CARGO_REGISTRY_TOKEN, so withhold GITHUB_TOKEN from git config too.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - name: Publish the engine, then the CLI (each skips if its version is already live)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN not set — skipping crates.io publish."
            exit 0
          fi
          # crates.io rejects UA-less requests, so always send one — without it
          # the guards never match and the publish steps fail redundantly.
          live() { curl -fsSL -A "socratic-council-release-ci" "https://crates.io/api/v1/crates/$1/$2" | grep -q '"num"'; }
          ENGINE_VERSION=$(grep -m1 '^version' engine/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if live socratic-council-engine "$ENGINE_VERSION"; then
            echo "socratic-council-engine $ENGINE_VERSION is already on crates.io — skipping."
          else
            cargo publish --locked -p socratic-council-engine
            # The index needs a moment before the dependent crate can resolve it.
            sleep 45
          fi
          VERSION="${GITHUB_REF_NAME#cli-v}"
          if live socratic-council "$VERSION"; then
            echo "socratic-council $VERSION is already on crates.io — skipping publish."
            exit 0
          fi
          cargo publish --locked -p socratic-council
