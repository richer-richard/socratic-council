[package]
name = "socratic-council"
version = "2.0.0"
edition = "2021"
rust-version = "1.88"
description = "A terminal council of AI models that deliberates a question in structured rounds and leaves a decision record — any model per seat across eight providers, native tools, a cost ledger with caps, and a ratatui TUI."
authors = ["Socratic Council Team"]
license = "Apache-2.0"
repository = "https://github.com/richer-richard/socratic-council"
homepage = "https://github.com/richer-richard/socratic-council"
readme = "README.md"
keywords = ["ai", "agents", "deliberation", "tui", "llm"]
categories = ["command-line-utilities"]
exclude = ["tests/fixtures/*"]

[[bin]]
name = "socratic-council"
path = "src/main.rs"

[lib]
name = "socratic_council"
path = "src/lib.rs"

[features]
default = ["desktop-bridge"]
# Reads the desktop app's already-stored keys + config + sessions so the user
# never re-enters an API key. Pulls only a bundled sqlite (to read the WebView
# localStorage); the XChaCha20-Poly1305 crypto is always compiled (the CLI
# encrypts its OWN key store with it too). Build with `--no-default-features`
# for a lean, pure-Rust CLI (no C deps) that uses env vars + `config set-key` +
# the in-TUI key manager.
desktop-bridge = ["dep:rusqlite"]

[dependencies]
socratic-council-engine = { version = "0.1.0", path = "../engine" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
directories = "5"
unicode-width = "0.2"
textwrap = "0.16"

# Desktop bridge (feature-gated): a bundled sqlite to read the app's WebView
# localStorage. The only C dependency, and only when the bridge is enabled.
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
