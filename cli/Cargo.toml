[package]
name = "socratic-council"
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
description = "A terminal multi-agent debate workstation — eight AI agents from eight providers argue any topic in a ratatui TUI."
authors = ["Socratic Council Team"]
license = "Apache-2.0"
repository = "https://github.com/richer-richard/socratic-council"
homepage = "https://github.com/richer-richard/socratic-council"
readme = "README.md"
keywords = ["ai", "agents", "debate", "tui", "llm"]
categories = ["command-line-utilities"]
exclude = ["tests/fixtures/*"]

[[bin]]
name = "socratic-council"
path = "src/main.rs"

[lib]
name = "socratic_council"
path = "src/lib.rs"

[features]
default = ["desktop-bridge"]
# Reads the desktop app's already-stored keys + config + sessions so the user
# never re-enters an API key. Pulls a bundled sqlite (to read the WebView
# localStorage) plus XChaCha20-Poly1305 (to open the app's `ENC1:` envelopes).
# Build with `--no-default-features` for a lean CLI that uses only env vars +
# `config set-key`.
desktop-bridge = ["dep:rusqlite", "dep:chacha20poly1305", "dep:base64"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
futures-util = "0.3"
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
thiserror = "2"
anyhow = "1"
directories = "5"
unicode-width = "0.2"
textwrap = "0.16"

# Desktop bridge (feature-gated): read the app's WebView localStorage + open
# its XChaCha20-Poly1305 `ENC1:` envelopes with the shared DEK.
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
lto = "thin"
strip = true
