[package]
name = "socratic-council"
version = "1.0.2"
edition = "2021"
rust-version = "1.82"
description = "A terminal multi-agent debate workstation — eight AI agents (each with a silent advisor) argue any topic in a ratatui TUI, with live conflict tracking, a cost ledger, and oracle web/file search."
authors = ["Socratic Council Team"]
license = "Apache-2.0"
repository = "https://github.com/richer-richard/socratic-council"
homepage = "https://github.com/richer-richard/socratic-council"
readme = "README.md"
keywords = ["ai", "agents", "debate", "tui", "llm"]
categories = ["command-line-utilities"]
exclude = ["tests/fixtures/*"]

[[bin]]
name = "socratic-council"
path = "src/main.rs"

[lib]
name = "socratic_council"
path = "src/lib.rs"

[features]
default = ["desktop-bridge"]
# Reads the desktop app's already-stored keys + config + sessions so the user
# never re-enters an API key. Pulls only a bundled sqlite (to read the WebView
# localStorage); the XChaCha20-Poly1305 crypto is always compiled (the CLI
# encrypts its OWN key store with it too). Build with `--no-default-features`
# for a lean, pure-Rust CLI (no C deps) that uses env vars + `config set-key` +
# the in-TUI key manager.
desktop-bridge = ["dep:rusqlite"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
futures-util = "0.3"
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
regex = "1"
thiserror = "2"
anyhow = "1"
directories = "6"
unicode-width = "0.2"
textwrap = "0.16"

# At-rest secret encryption (always compiled, pure Rust): the CLI encrypts its
# own key store with XChaCha20-Poly1305 and reads the desktop app's `ENC1:`
# envelopes with the same primitive. No OS keychain, builds on every platform.
chacha20poly1305 = "0.11"
base64 = "0.22"
getrandom = "0.4"

# Desktop bridge (feature-gated): a bundled sqlite to read the app's WebView
# localStorage. The only C dependency, and only when the bridge is enabled.
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
lto = "thin"
strip = true
